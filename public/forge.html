<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GalaQuest Asset Forge</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>">
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --bg: #071017;
        --panel: rgba(10, 20, 29, 0.94);
        --panel-soft: rgba(15, 29, 40, 0.88);
        --line: rgba(186, 210, 221, 0.16);
        --text: #ecf4f1;
        --muted: #8da3ab;
        --gold: #e7bb58;
        --mint: #76d6b4;
        --red: #ef826f;
        --blue: #78baf0;
      }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); overflow: hidden; }
      button, input, select { font: inherit; }
      button { color: inherit; }
      #forge { width: 100%; height: 100%; display: grid; grid-template-columns: 286px minmax(0, 1fr) 354px; grid-template-rows: 54px minmax(0, 1fr); }
      #topbar {
        grid-column: 1 / -1; z-index: 8; display: flex; align-items: center; gap: 0.8rem;
        padding: 0 0.85rem; border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, #101d27, #0b151e); box-shadow: 0 7px 30px #0008;
      }
      .brand { display: flex; align-items: baseline; gap: 0.55rem; min-width: 270px; }
      .brand strong { letter-spacing: 0.11em; font-size: 0.93rem; }
      .brand span { color: var(--gold); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; }
      .top-meta { display: flex; align-items: center; gap: 0.45rem; margin-left: auto; }
      .badge { border: 1px solid var(--line); border-radius: 999px; padding: 0.25rem 0.55rem; color: var(--muted); font: 700 0.68rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .badge.good { color: var(--mint); border-color: #76d6b455; }
      .badge.warn { color: var(--gold); border-color: #e7bb5855; }
      .top-link { color: #c8d8df; text-decoration: none; padding: 0.35rem 0.5rem; border-radius: 0.35rem; }
      .top-link:hover { background: #ffffff10; }

      .panel { min-width: 0; min-height: 0; background: var(--panel); overflow: auto; scrollbar-color: #405765 transparent; }
      #left-panel { border-right: 1px solid var(--line); }
      #right-panel { border-left: 1px solid var(--line); }
      .section { padding: 0.82rem; border-bottom: 1px solid var(--line); }
      .section h2, .section h3 { margin: 0 0 0.65rem; text-transform: uppercase; letter-spacing: 0.11em; font-size: 0.69rem; color: #a9bdc5; }
      .section h2 { color: var(--gold); }
      .micro { color: var(--muted); font-size: 0.71rem; line-height: 1.45; }
      .card { border: 1px solid var(--line); background: #ffffff06; border-radius: 0.55rem; padding: 0.7rem; margin-bottom: 0.55rem; }
      .card-title { display: flex; gap: 0.55rem; align-items: center; }
      .card-title strong { flex: 1; font-size: 0.84rem; }
      .candidate-button { width: 100%; cursor: pointer; text-align: left; color: var(--text); }
      .candidate-button.active { border-color: #e7bb5888; box-shadow: inset 3px 0 var(--gold); background: #e7bb580c; }
      .candidate-button .tier { color: var(--gold); font: 700 0.64rem/1 ui-monospace, monospace; }
      .candidate-button .meta { margin-top: 0.36rem; color: var(--muted); font-size: 0.69rem; }

      #stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: radial-gradient(circle at 50% 42%, #243844 0%, #111d26 46%, #081118 100%); }
      #forge-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #stage-status {
        position: absolute; top: 0.7rem; left: 50%; transform: translateX(-50%); z-index: 3;
        padding: 0.36rem 0.62rem; border: 1px solid var(--line); border-radius: 999px;
        background: #09131bd9; color: #d8e7ea; font: 700 0.68rem/1 ui-monospace, monospace;
      }
      #stage-toolbar {
        position: absolute; z-index: 4; left: 50%; bottom: max(0.75rem, env(safe-area-inset-bottom)); transform: translateX(-50%);
        display: flex; flex-wrap: wrap; justify-content: center; gap: 0.35rem; max-width: calc(100% - 1rem);
        padding: 0.4rem; border: 1px solid var(--line); border-radius: 0.65rem; background: #09131be8; backdrop-filter: blur(10px);
      }
      #stage-toolbar button, .small-button, .action-button {
        border: 1px solid var(--line); background: #182935; border-radius: 0.4rem; min-height: 2rem; padding: 0.34rem 0.56rem; cursor: pointer;
      }
      #stage-toolbar button:hover, .small-button:hover, .action-button:hover { border-color: #ffffff4a; background: #203645; }
      #stage-toolbar button[aria-pressed="true"] { color: var(--gold); border-color: #e7bb5870; }

      .field { margin-bottom: 0.68rem; }
      .field > label { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; color: #c8d8df; font-size: 0.72rem; font-weight: 800; margin-bottom: 0.28rem; }
      .field > label span { color: var(--muted); font: 600 0.64rem/1 ui-monospace, monospace; }
      input[type="text"], input[type="password"], input[type="number"], select {
        width: 100%; border: 1px solid var(--line); border-radius: 0.38rem; background: #0c1821; color: var(--text); padding: 0.45rem 0.5rem;
      }
      input:focus, select:focus { outline: 2px solid #78baf044; border-color: var(--blue); }
      .axis-grid { display: grid; grid-template-columns: 32px minmax(0, 1fr) 36px 36px; gap: 0.3rem; align-items: center; margin-bottom: 0.36rem; }
      .axis-grid strong { font: 800 0.72rem/1 ui-monospace, monospace; text-align: center; }
      .axis-grid input { min-width: 0; }
      .axis-grid button { height: 2rem; border: 1px solid var(--line); border-radius: 0.35rem; background: #172733; cursor: pointer; }
      .axis-grid button:hover { border-color: #e7bb5870; }
      .axis-grid[data-axis="x"] strong { color: #ef8b84; }
      .axis-grid[data-axis="y"] strong { color: #82d99e; }
      .axis-grid[data-axis="z"] strong { color: #7dbcf4; }
      .nudge-row { display: flex; gap: 0.35rem; flex-wrap: wrap; align-items: center; margin: 0.3rem 0 0.75rem; }
      .nudge-row button { border: 1px solid var(--line); background: #101f2a; color: var(--muted); border-radius: 999px; padding: 0.25rem 0.48rem; cursor: pointer; font-size: 0.68rem; }
      .nudge-row button.active { color: var(--gold); border-color: #e7bb5870; }
      .transform-readout { white-space: pre-wrap; overflow-wrap: anywhere; color: #9ec0c9; background: #061018; border-radius: 0.45rem; padding: 0.55rem; font: 0.63rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .button-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.42rem; }
      .action-button.primary { background: #6f581f; border-color: #d4a942; color: #fff4cf; font-weight: 800; }
      .action-button.danger { color: #ffb6a8; }
      .coverage { display: flex; gap: 0.35rem; flex-wrap: wrap; }
      .coverage span { border-radius: 999px; border: 1px solid #76d6b43f; color: var(--mint); background: #76d6b40c; padding: 0.25rem 0.48rem; font: 700 0.65rem/1 ui-monospace, monospace; }

      .meshy-status { display: flex; align-items: center; gap: 0.45rem; margin-bottom: 0.6rem; }
