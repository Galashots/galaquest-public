<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- maximum-scale=1, user-scalable=no: a child trapped inside iOS's double-tap zoom, especially
         in Add-to-Home-Screen STANDALONE mode where there is no browser chrome (no address bar, no
         pinch-to-reset affordance) to rescue them, is indistinguishable from the game being broken.
         This alone stops the platform from ever entering a zoomed state at all; index.html's own
         touch-action rules and main.js's dblclick/touchend guards are the belt-and-braces for the
         gestures a browser can still try to interpret as zoom intent even with scaling disabled. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>GalaQuest Runtime Slice</title>
    <!-- Zero-network: a bare "no icon yet" declaration, not a real icon asset (Y/Task F1). Without
         this, a browser with no <link rel="icon"> still auto-requests /favicon.ico and logs a 404 --
         every runtime-test harness has carried a "cosmetic, ignore it" allowlist entry for exactly
         this since Phase V. A transparent 1x1 data URI costs one request-free string, not a fetch. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>">
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182331; touch-action: none; overscroll-behavior: none; }
      #game { position: relative; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* Bottom CENTRE. It was bottom-right, chosen because the perf HUD spans the full width of a
         390px phone and a top-left status line sat unreadable underneath it. The attack button now
         claims the bottom-right — that corner is where the right thumb rests, so it belongs to the
         primary action, not to a readout. Centre is the "lower" zone: least reachable, which is
         exactly right for something you read and never press. */
      #runtime-status {
        position: absolute; bottom: 0.75rem; left: 50%; transform: translateX(-50%);
        max-width: calc(100% - 17rem); padding: 0.4rem 0.6rem;
        color: #fff; background: rgb(12 20 31 / 75%); border-radius: 0.35rem;
        font: 700 0.8rem/1.2 system-ui, sans-serif; text-align: center;
        touch-action: none; pointer-events: none;
      }
      /* DEVELOPER TELEMETRY, hidden in play -- the same data-debug convention #perf-hud already uses,
         because a second mechanism for "show this only to a developer" is a second thing to keep
         true. This line read `you (14.2,-3.1) · wolf 3hp · you 4hp · players 1` permanently, over
         the game, for the whole session. None of it is for a child: their health is the bar, the
         wolf's is the bar over the wolf, and the coordinates and player count are for me.

         BUT NOT WHEN IT IS A FAULT. The same element carries the four things that get said when the
         game breaks -- context lost, hero load failed, bootstrap failed. Those are the one case
         where the text is worth more than the clutter, so data-fault overrides the hide. They are
         still developer-worded, and making them child-readable is a real error screen and a
         separate piece of work; hiding them would be shipping LESS than that, not more.

         Harnesses are unaffected: eighteen of them read this element's textContent, which CSS does
         not touch. #perf-hud's own comment records that same check being made before it was hidden. */
      #runtime-status[data-debug="false"]:not([data-fault="true"]) { display: none; }
      /* Mirrors the stick: same size, same inset, opposite corner. Microsoft's touch-layout guidance,
         drawn from over 200 streamed titles, reserves the right inner wheel for exactly ONE control —
         the most frequent action — with a large hit area, and warns that thumbs cannot reach far
         toward the centre of the screen. So: primary attack, big, out at the grip. */
      #attack-button {
        position: absolute; right: 1rem; bottom: 1rem; width: 112px; height: 112px;
        display: grid; place-items: center;
        border: 2px solid rgb(255 255 255 / 55%); border-radius: 50%;
        background: rgb(196 92 62 / 42%); color: #fff;
        font: 800 1.05rem/1 system-ui, sans-serif; letter-spacing: 0.04em;
        touch-action: none; user-select: none; -webkit-user-select: none;
        transition: transform 90ms ease-out, background-color 90ms ease-out;
      }
      #attack-button[data-pressed="true"] { background: rgb(226 122 84 / 78%); transform: scale(0.94); }
      /* GP1: hidden, not merely disabled, while the Hero screen is open -- main.js's own onOpenChange
         sets this, matched by the SAME frame-loop input gate (heroScreenOpen) that force-zeroes
         movement and attack, so this is belt-and-braces the same way #attack-button[data-ready] is:
         a visual promise checked by real logic, not the only thing enforcing it. */
      #touch-stick[data-suspended="true"], #attack-button[data-suspended="true"] {
        opacity: 0; pointer-events: none; transition: opacity 150ms ease-out;
      }
      /* Found by looking at a real capture (hero-screen-portrait-open.png): the slots row and
         Aldric's speech bubble both sit centred in roughly the same vertical band, so opening Hero
         while standing near an NPC read as the two fighting for the same space. #game carries
         data-hero-screen-open (main.js's onOpenChange, same pattern as the button-suspend attributes
         above) rather than putting this on #hero-screen itself, because keeper-speech/quest-objective
         are EARLIER siblings in the DOM and a CSS sibling combinator only reaches forward. A full-
         screen modal hiding transient background HUD text is standard, not a scope add -- the world
         keeps simulating underneath (this is still non-blocking), only the text callouts pause. */
      #game[data-hero-screen-open="true"] #keeper-speech,
      #game[data-hero-screen-open="true"] #quest-objective,
      #game[data-hero-screen-open="true"] #banner,
      #game[data-hero-screen-open="true"] #hero-health,
      #game[data-hero-screen-open="true"] #hero-progress,
      #game[data-hero-screen-open="true"] #lantern-marks,
      #game[data-hero-screen-open="true"] #loot-hud,
      #game[data-hero-screen-open="true"] #streak-meter {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* MODAL ISOLATION, SECOND HALF: the navigation layer gets out of the way too.
         The rule above already hid the transient TEXT callouts. Exact-SHA browser captures at the
         frozen child baseline still showed the minimap and "Show me where" sitting behind a
         full-screen panel, and the OTHER panel's button competing in the same top-right row -- so a
         child looking at the Hero screen still had a map, an arrow, a rescue button and a second
         menu icon arguing with it. Subtracting competing HUD, not adding any.
         The inactive sibling button goes with them: while Hero owns the screen the map button is not
         an escape, it is the thing that was covering the X. The ACTIVE panel keeps its own toggle
         (so the button that opened it still closes it) and its own X. */
      #game[data-hero-screen-open="true"] #minimap,
      #game[data-hero-screen-open="true"] #objective-pointer,
      #game[data-hero-screen-open="true"] #objective-marker,
      #game[data-hero-screen-open="true"] #guidance-rescue,
      #game[data-hero-screen-open="true"] #village-board-button {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* GP3: the Village Board hides the identical set of transient HUD text, for the identical
         reason -- a second full-screen overlay competing with keeper-speech/quest-objective for the
         same on-screen space. Its own attribute rather than folding into [data-hero-screen-open]
         above: the two screens are mutually exclusive (main.js closes one before opening the other),
         but keeping each screen's own boolean keeps this rule readable from either screen's own
         onOpenChange without one having to know the other's attribute name. */
      #game[data-village-board-open="true"] #keeper-speech,
      #game[data-village-board-open="true"] #quest-objective,
      #game[data-village-board-open="true"] #banner,
      #game[data-village-board-open="true"] #hero-health,
      #game[data-village-board-open="true"] #lantern-marks,
      #game[data-village-board-open="true"] #loot-hud,
      #game[data-village-board-open="true"] #streak-meter {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* MODAL ISOLATION, SECOND HALF: the navigation layer gets out of the way too.
         The rule above already hid the transient TEXT callouts. Exact-SHA browser captures at the
         frozen child baseline still showed the minimap and "Show me where" sitting behind a
         full-screen panel, and the OTHER panel's button competing in the same top-right row -- so a
         child looking at the Hero screen still had a map, an arrow, a rescue button and a second
         menu icon arguing with it. Subtracting competing HUD, not adding any.
         The inactive sibling button goes with them: while Hero owns the screen the map button is not
         an escape, it is the thing that was covering the X. The ACTIVE panel keeps its own toggle
         (so the button that opened it still closes it) and its own X. */
      #game[data-village-board-open="true"] #minimap,
      #game[data-village-board-open="true"] #objective-pointer,
      #game[data-village-board-open="true"] #objective-marker,
      #game[data-village-board-open="true"] #guidance-rescue,
      #game[data-village-board-open="true"] #hero-button {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* Greyed while the swing is on cooldown, so mashing it reads as "not yet" rather than "broken". */
      #attack-button[data-ready="false"] { opacity: 0.45; }
      /* A whiff reads differently from a hit without any text: nothing happens to the wolf (nothing
         was struck), and the button the child's thumb is already on pulses a flat neutral grey
         instead of its usual orange press colour. After data-pressed so it wins if a slow tap is
         still down when the swing resolves -- see combat/feedback.js for the reasoning. Explicit
         opacity: 1 because a miss always lands during the same cooldown window that dims the button
         to 0.45 -- measured in tools/runtime-test/play-fight.mjs's fight-swing-miss.png capture,
         where the grey was nearly invisible under that dimming until this line was added. A miss is
         more informative than "not ready yet" and must read at full strength over it. */
      #attack-button[data-feedback="miss"] { background: rgb(150 150 150 / 60%); opacity: 1; }
      /* GP1-C5: the grey alone was not enough. The brief is that mashing ATTACK at nothing must not
         feel like the button stopped working, and a colour swap on a control the thumb is COVERING is
         the one piece of feedback a player is guaranteed not to see. So a miss also throws a ring off
         the button, outward past the thumb, where it is visible from the edges. It stays on the
         button rather than touching the wolf on purpose -- a miss is a fact about the player's own
         action, and marking the wolf for a blow that never reached it is the confusion this avoids
         (see combat/feedback.js's own note on Fortnite's hit marker vs WoW's "Miss" text).
         Deliberately position:absolute rather than a grid item: #attack-button centres its label with
         place-items, and a pseudo-element joining that grid would push the label instead of overlaying
         it. */
      #attack-button::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        border: 5px solid rgb(255 255 255 / 92%);
        opacity: 0; transform: scale(1); pointer-events: none;
      }
      #attack-button[data-feedback="miss"]::after { animation: miss-ring 420ms ease-out 1; }
      /* HOLDS before it goes. The first version faded linearly from the instant it appeared, and in
         .local/runtime-test/fight-landscape-swing-miss.png -- the first frame that ever caught this
         at all -- it had already thinned to a barely-there hairline by the time the screenshot
         encoded. A ring that is only bright for the few milliseconds nobody is looking at is not
         feedback. So: full strength through the first 45%, then leave. It also travels less far now
         (1.45 rather than 1.7) -- spreading the same amount of ink over a bigger circle is what made
         it thin, and a ring that stays near the thumb is still clear of it. */
      @keyframes miss-ring {
        0%   { opacity: 1; transform: scale(1); }
        45%  { opacity: 1; transform: scale(1.28); }
        100% { opacity: 0; transform: scale(1.45); }
      }
      /* A BAR AND A NUMBER since P2 -- see combat/feedback.js for why the same reference research
         that once chose a row of hearts now chooses this, and #hero-health's own markup comment for
         what it replaced. Same dark pill treatment as the other HUD readouts so red still reads
         against open sky, and the same fixed top-left anchor so nothing about the status column
         moved. The pill is a FIXED WIDTH regardless of the numbers in it: the bar's length is the
         signal, and a pill that grew as a hero levelled would move the lantern row underneath it. */
      #hero-health {
        position: absolute; top: 0.75rem; left: 0.75rem;
        display: flex; gap: 0.4rem; align-items: center;
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        line-height: 1;
        pointer-events: none; touch-action: none;
      }
      #hero-health .health-icon { color: #e0334f; font-size: 1.15rem; line-height: 1; }
      #hero-health .health-icon::after { content: '\2665'; }
      /* THICK, on purpose: the brief's own word, and the reason is a thumb-held tablet at arm's
         length rather than a monitor. 0.62rem is about the height of the numerals beside it, which is
         what makes the two read as one readout instead of a bar with a caption. */
      #hero-health .health-track {
        display: block; width: 6.5rem; height: 0.62rem; border-radius: 0.31rem;
        background: rgb(255 255 255 / 18%); overflow: hidden;
      }
      #hero-health .health-fill {
        display: block; height: 100%; width: 100%; border-radius: 0.31rem;
        background: linear-gradient(90deg, #e0334f, #ff6b7f);
        transform-origin: left center;
        transition: width 180ms ease-out, background 180ms ease-out;
      }
      /* THE LAST OF IT LOOKS DIFFERENT. A bar that only shortens says "you are losing"; a bar that
         changes colour says "you are nearly out", which is the thing a child needs a beat earlier
         than the geometry alone gives them. Set by main.js off the same fraction that sizes the
         fill, so the two can never disagree about what "low" means. */
      #hero-health[data-low="true"] .health-fill { background: linear-gradient(90deg, #d11f2f, #ff9a3d); }
      #hero-health .health-count { font: 700 0.95rem/1 system-ui, sans-serif; color: #fff; font-variant-numeric: tabular-nums; }
      /* Tabular numerals above and a fixed-width slash here for the same reason: the readout must not
         jitter horizontally as 30 becomes 9 and back. */
      #hero-health .health-slash { opacity: 0.55; margin: 0 0.15rem; }
      /* Beating a wolf gives health back (healTheStanding in combat/encounter.js). The bar refills on
         its own from renderHealth -- this makes the row ANNOUNCE it, because a child watching a wolf
         dissolve eighteen metres away is not looking at the top-left corner. Green, and scaling UP,
         so it cannot be confused with the red damage vignette, which is the other thing that happens
         to this readout and means the opposite. Fast in, slow out, the same shape #hero-hurt-flash
         uses and for the same reason. */
      #hero-health { transform-origin: left center; transition: transform 320ms ease-out, box-shadow 320ms ease-out; }
      #hero-health[data-healing="true"] {
        transform: scale(1.16);
        box-shadow: 0 0 0.85rem 0.15rem rgb(126 226 138 / 75%);
        transition: transform 90ms ease-out, box-shadow 90ms ease-out;
      }
      /* R1: OUT-OF-COMBAT REGEN, and it must read as a DIFFERENT thing from the pop above. That pop
         is a one-shot event (a kill's own heal, a heart), sharp and scale-driven; regen is a passive
         climb with no single moment to announce, so it gets a slow LOOPING shimmer instead -- same
         green (this is still "you are healing"), no scale change at all, so the two can never be
         confused for the same cue even landing seconds apart. See combat/feedback.js's own
         isOutOfCombatRegenRise for how main.js tells the two apart from the hp numbers alone. */
      #hero-health[data-regen="true"] { animation: regen-shimmer 1.1s ease-in-out infinite; }
      @keyframes regen-shimmer {
        0%, 100% { box-shadow: 0 0 0 rgb(126 226 138 / 0%); }
        50% { box-shadow: 0 0 0.55rem 0.05rem rgb(126 226 138 / 55%); }
      }
      /* P2: LEVEL, THE METER, AND POWER -- one pill, directly under the health readout, and the
         second member of the top-left status column rather than a new corner. See its own markup
         comment for why the three sit together.
         FIXED WIDTH, deliberately: a Level that reaches two digits or a POWER that reaches five must
         not widen the pill, because the rows beneath it are positioned by hand and a pill that grows
         would shove the whole column sideways as a child gets stronger. Tabular numerals for the same
         reason at a smaller scale -- the meter must not jitter as the XP count ticks. */
      #hero-progress {
        position: absolute; top: calc(0.75rem + 2.5rem); left: 0.75rem;
        display: flex; gap: 0.4rem; align-items: center;
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        font: 800 0.8rem/1 system-ui, sans-serif; color: #fff;
        font-variant-numeric: tabular-nums;
        pointer-events: none; touch-action: none;
      }
      #hero-progress .hero-progress-level { color: #f2b33d; letter-spacing: 0.04em; }
      /* The meter. Same track/fill construction as the health bar above it and deliberately SHORTER
         and THINNER -- they are different promises and must not read as two of the same thing: one is
         "how much of you is left", which a child needs at a glance mid-fight, and this is "how close
         you are", which they look at between fights. Gold rather than red for the same reason. */
      #hero-progress .hero-progress-meter {
        display: block; width: 4.2rem; height: 0.4rem; border-radius: 0.2rem;
        background: rgb(255 255 255 / 18%); overflow: hidden;
      }
      #hero-progress .xp-fill {
        display: block; height: 100%; width: 0%; border-radius: 0.2rem;
        background: linear-gradient(90deg, #f2b33d, #ffe08a);
        transition: width 240ms ease-out;
      }
      #hero-progress .hero-progress-xp { font-weight: 700; font-size: 0.7rem; opacity: 0.75; }
      #hero-progress .hero-progress-power { display: inline-flex; align-items: center; gap: 0.18rem; color: #ffd76e; }
      #hero-progress .hero-progress-power-icon::after { content: '\26A1'; font-size: 0.8rem; }
      /* The moment the meter completes. One beat, on the pill AND the fill, so the eye is PULLED to
         the corner rather than expected to already be looking there -- the same argument
         #lantern-marks[data-just-lit] makes for itself, and the same 700ms shape. */
      #hero-progress[data-levelled="true"] { animation: hero-progress-lift 900ms ease-out 1; }
      #hero-progress[data-levelled="true"] .xp-fill { animation: xp-complete 900ms ease-out 1; }
      /* AND THE ROLLOVER SNAPS. The 240ms ease above is right for XP trickling in and wrong for the
         one moment the meter empties: caught in a capture, it left a full gold bar sitting beside a
         label already reading "0 / 150", which for a quarter of a second says two different things.
         Turning the transition off for the duration of the beat makes the reset instant, so the bar
         is full, then the level flips, then the bar is empty -- three states, each of them true. */
      #hero-progress[data-levelled="true"] .xp-fill { transition: none; }
      @keyframes hero-progress-lift {
        0%   { background: rgb(12 20 31 / 75%); transform: scale(1); }
        16%  { background: rgb(78 56 18 / 94%); transform: scale(1.1); }
        100% { background: rgb(12 20 31 / 75%); transform: scale(1); }
      }
      @keyframes xp-complete {
        0%   { filter: brightness(1); }
        16%  { filter: brightness(2.4); }
        100% { filter: brightness(1); }
      }
      /* Lantern Marks, D4: three pips directly under the health readout, same dark-pill / same fill
         convention (see combat/feedback.js's health research for why filled-icon-not-a-bar suits a
         small FIXED integer, which MARKS_TO_UNLOCK still is and HERO_MAX_HP no longer is). Read-only
         and out of touch-flow, so the touch-target-size rules elsewhere on this page do not apply.
         Glyph is a plain filled dot, not a lantern pictogram: a placeholder shape like the six
         audio recipes are placeholder sounds -- what it looks like is a later the owner-on-iPad call,
         same as the growl and the other five. */
      #lantern-marks {
        /* One row further down since P2 put #hero-progress between this and the health readout. */
        position: absolute; top: calc(0.75rem + 2.5rem + 2rem); left: 0.75rem;
        display: flex; gap: 0.15rem; align-items: center;
        padding: 0.3rem 0.5rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        font-size: 1.35rem; line-height: 1;
        pointer-events: none; touch-action: none;
      }
      /* GP1-C6: A LANTERN MARK, NOT A DOT.
         These were three U+25CF bullets that changed colour, which is exactly what a Lantern Mark
         must not look like: the reward the whole first chapter is built around read as 'something
         happened to one of the dots'. An empty slot is now a HOLLOW four-point spark and a filled
         one is a SOLID, glowing one -- the same shape as the light that just flew off the wolf and
         into the boy, so the icon and the thing it counts are visibly the same object. Earned vs not
         is now shape AND fill AND glow rather than hue alone, which also means it survives being
         looked at by someone who does not tell gold from grey. */
      #lantern-marks .mark {
        color: rgb(255 255 255 / 28%);
        display: inline-block;
        transition: color 120ms ease-out, text-shadow 200ms ease-out;
      }
      #lantern-marks .mark::after { content: '\2727'; }
      #lantern-marks .mark[data-filled="true"] {
        color: #f2b33d; text-shadow: 0 0 10px rgb(242 179 61 / 90%), 0 0 22px rgb(242 179 61 / 45%);
      }
      #lantern-marks .mark[data-filled="true"]::after { content: '\2726'; }
      /* The moment it lights. main.js sets this for one beat when the mark's own light ARRIVES at
         the boy -- not when the server says the kill counted, which is most of a second earlier and
         is why the reward used to land underneath the kill's own payoff and lose. One pip igniting
         is the smallest thing that can say 'THAT is what you just earned'; it does not need a
         fireworks system, it needs to be the thing moving at the moment nothing else is. */
      #lantern-marks .mark[data-just-lit="true"] { animation: mark-ignite 700ms ease-out 1; }
      @keyframes mark-ignite {
        0%   { transform: scale(1);    filter: brightness(1); }
        18%  { transform: scale(1.85); filter: brightness(2.2); }
        100% { transform: scale(1);    filter: brightness(1); }
      }
      /* ...and the pill it sits in leans in with it, so the eye is PULLED to the corner rather than
         being expected to already be looking there. */
      #lantern-marks[data-just-lit="true"] { animation: mark-pill-lift 700ms ease-out 1; }
      @keyframes mark-pill-lift {
        0%   { background: rgb(12 20 31 / 75%); }
        18%  { background: rgb(78 56 18 / 94%); }
        100% { background: rgb(12 20 31 / 75%); }
      }
      /* GP2: coins and Wildwood Shards, same dark-pill/read-only/out-of-touch-flow treatment as
         hero-health and lantern-marks -- this is the fourth member of the same top-left status
         column, not a new visual language. Top-right rather than stacking under lantern-marks: that
         corner already holds #perf-hud (debug-only, hidden by default) and #hero-button, both far
         enough from the thumbs that a third small pill reads as one status cluster rather than
         crowding the left side where the child's own health/marks live. Two glyphs, not one shared
         "loot" icon -- a filled circle (coin) and a diamond (shard), the same silhouette difference
         the physical pickups themselves use, so a glance at the HUD and a glance at the ground agree
         on what a coin looks like versus what a shard looks like. Deliberately NOT updated the
         instant a server snapshot says the count went up -- main.js only calls renderLootHud() once
         a pickup's own attraction flight has actually arrived (world/lootPickups.js's `update()`
         return value), which is the whole point of GP2's "HUD totals must not update before the
         pickup reaches its collection endpoint" rule. */
      #loot-hud {
        position: absolute; top: calc(0.75rem + 52px + 0.5rem); right: 0.75rem;
        display: flex; gap: 0.5rem; align-items: center;
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        font: 700 1rem/1 system-ui, sans-serif; color: #fff;
        pointer-events: none; touch-action: none;
      }
      #loot-hud .loot-count { display: inline-flex; align-items: center; gap: 0.3rem; }
      #loot-hud .loot-icon { font-size: 1rem; line-height: 1; }
      #loot-hud .loot-icon::after { content: '\25CF'; }
      #loot-hud .loot-count[data-kind="shard"] .loot-icon { color: #b98be0; }
      #loot-hud .loot-count[data-kind="shard"] .loot-icon::after { content: '\25C6'; }
      #loot-hud .loot-count[data-kind="coin"] .loot-icon { color: #f2c14e; }
      /* Same brief pop-and-settle the health row uses on a heal (#hero-health[data-healing]) -- a
         number that merely changes value is easy to miss in a HUD corner; a number that visibly
         pops is not. Reset by main.js the same way flashHeroHurt's timer is: a fresh setTimeout on
         every arrival, so two pickups landing close together each get their own pop. */
      #loot-hud .loot-count[data-popped="true"] { animation: loot-pop 260ms ease-out; }
      @keyframes loot-pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
      /* R1: THE STREAK METER. Directly under the loot HUD it shares a corner with -- appears at 2+
         kills within progression/streaks.js's own STREAK_WINDOW_SECONDS, disappears the instant the
         window lapses (main.js only renders it while progression/streakView.js's streakMeterView
         returns non-null, the same "absent means nothing to show" discipline the quest objective row
         already keeps). A ring rather than a number for the countdown -- combat/feedback.js's own
         reference research already settled on a depleting shape over a ticking clock for exactly this
         "time is running out, wordlessly" job. */
      #streak-meter {
        position: absolute; top: calc(0.75rem + 52px + 0.5rem + 2.55rem); right: 0.75rem;
        display: flex; gap: 0.45rem; align-items: center;
        padding: 0.25rem 0.7rem 0.25rem 0.25rem; border-radius: 999px;
        background: rgb(12 20 31 / 78%);
        opacity: 0; transform: scale(0.85);
        transition: opacity 160ms ease-out, transform 160ms ease-out;
        pointer-events: none; touch-action: none;
      }
      #streak-meter[data-shown="true"] { opacity: 1; transform: scale(1); }
      /* Escalating colour by tier -- gold at x1/x2 (this game's own "reward" colour, #loot-hud's own
         coin dot), a hotter orange-red for x3 ("ON FIRE"), so the ring's own colour already says
         which of the three states progression/streaks.js's own header names a child is in. */
      .streak-ring {
        --streak-fraction: 1; --streak-color: #f2c14e;
        width: 2.15rem; height: 2.15rem; border-radius: 50%;
        background: conic-gradient(var(--streak-color) calc(var(--streak-fraction) * 360deg), rgb(255 255 255 / 18%) 0);
        display: flex; align-items: center; justify-content: center;
        transition: background 160ms linear;
      }
      #streak-meter[data-tier="3"] .streak-ring { --streak-color: #ff5c3d; }
      .streak-ring .streak-count {
        width: 1.55rem; height: 1.55rem; border-radius: 50%;
        background: rgb(12 20 31 / 96%); display: flex; align-items: center; justify-content: center;
        font: 800 0.72rem/1 system-ui, sans-serif; color: #fff; font-variant-numeric: tabular-nums;
      }
      .streak-label { font: 800 0.72rem/1.15 system-ui, sans-serif; letter-spacing: 0.04em; color: #fff; }
      /* One pulse per kill -- stronger on the frame a tier is actually crossed (streakMeterView's own
         justReachedTier2/3), same brief pop-and-settle #loot-hud's own count already uses on arrival. */
      #streak-meter[data-pulse="true"] { animation: streak-pulse 260ms ease-out; }
      #streak-meter[data-pulse="tier"] { animation: streak-pulse-tier 420ms ease-out; }
      @keyframes streak-pulse { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }
      @keyframes streak-pulse-tier { 0% { transform: scale(1); } 35% { transform: scale(1.3); } 100% { transform: scale(1); } }
      /* The standing objective. Sits directly under #lantern-marks (0.75 + 2.5 for the health row,
         + 2 for the level/POWER row, + 2.2 for the pips row), same pill treatment, same
         read-only/out-of-touch-flow rules. Left aligned with the bar, the meter and the pips so the
         whole top-left corner reads as one status column. */
      #quest-objective {
        position: absolute; top: calc(0.75rem + 2.5rem + 2rem + 2.2rem); left: 0.75rem;
        max-width: min(20rem, calc(100% - 10rem));
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        color: #fff; background: rgb(12 20 31 / 75%);
        font: 700 0.9rem/1.25 system-ui, sans-serif;
        opacity: 0; transition: opacity 220ms ease-out;
        pointer-events: none; touch-action: none;
      }
      #quest-objective[data-shown="true"] { opacity: 1; }
      /* ── P2: THE LEVEL-UP CEREMONY ────────────────────────────────────────────────────────────
         The strongest routine progression celebration in the game, and it had to stop being a banner
         -- see its own markup comment for the capture that settled that.
         WHERE IT SITS is the first decision. Centred horizontally and in the UPPER-MIDDLE band, not
         dead centre: the hero stands slightly below the middle of the frame at gameplay framing (see
         any capture under .local/runtime-test/), and a card over the middle would cover the child's
         own body at the exact moment they are meant to be looking at it. The bottom third belongs to
         the stick and ATTACK and is never covered by anything.
         POINTER-EVENTS NONE throughout: the fight keeps running underneath and a child can keep
         swinging through the whole ceremony. It celebrates, it does not interrupt. */
      #level-up {
        position: absolute; inset: 0; display: grid; place-items: start center;
        /* Measured against a real capture rather than chosen: at 18% the card's top-left corner
           clipped the objective chip in portrait. 22% clears the whole top-left status column and
           still sits well above the hero, who stands just below the middle of the frame. */
        padding-top: 22%;
        pointer-events: none; touch-action: none;
        opacity: 0; transition: opacity 260ms ease-out;
      }
      #level-up[data-shown="true"] { opacity: 1; transition: opacity 90ms ease-in; }
      #level-up-card {
        display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
        padding: 0.9rem 1.6rem; border-radius: 0.9rem;
        border: 2px solid rgb(242 179 61 / 70%);
        background: rgb(12 20 31 / 92%); color: #fff;
        text-align: center;
        /* The glow IS the "strongest celebration" half. Two shadows: a tight warm ring on the card
           and a wide soft bloom past it, which is what makes it read as light rather than as a box
           with a yellow border. */
        box-shadow: 0 0 1.2rem 0.15rem rgb(242 179 61 / 55%), 0 0 3.5rem 0.6rem rgb(242 179 61 / 22%);
        transform: scale(0.86);
        transition: transform 260ms cubic-bezier(0.2, 1.4, 0.5, 1);
      }
      #level-up[data-shown="true"] #level-up-card { transform: scale(1); }
      /* The two words themselves, and the only thing on screen this size. */
      #level-up-title {
        font: 900 2.1rem/1 system-ui, sans-serif; letter-spacing: 0.06em;
        color: #ffd76e;
        text-shadow: 0 0 0.6rem rgb(255 215 110 / 90%), 0 0 1.6rem rgb(242 179 61 / 55%);
      }
      #level-up[data-shown="true"] #level-up-title { animation: level-up-pulse 900ms ease-out 1; }
      @keyframes level-up-pulse {
        0%   { transform: scale(1);    filter: brightness(1); }
        18%  { transform: scale(1.14); filter: brightness(1.8); }
        100% { transform: scale(1);    filter: brightness(1); }
      }
      #level-up-level {
        font: 800 1.15rem/1 system-ui, sans-serif; letter-spacing: 0.1em; color: #fff; opacity: 0.9;
      }
      /* The two real stat gains, side by side. These are the "it changed the game" half, and they are
         deliberately as legible as the title: a ceremony whose numbers a child cannot read is a
         flash. */
      #level-up-gains {
        display: flex; gap: 1.1rem; margin-top: 0.25rem;
        font: 700 0.8rem/1.2 system-ui, sans-serif; letter-spacing: 0.05em; opacity: 0.85;
      }
      #level-up-gains .level-up-gain-value { font-weight: 900; font-size: 1.05rem; color: #7ee28a; }
      /* before -> delta -> after, the shape #41 names. Tabular numerals so the three numbers line up
         as a sentence rather than jostling. */
      #level-up-power {
        display: flex; align-items: baseline; gap: 0.35rem; margin-top: 0.35rem;
        font: 800 1rem/1 system-ui, sans-serif; color: #ffd76e;
        font-variant-numeric: tabular-nums;
      }
      #level-up-power .level-up-power-label { font-size: 0.7rem; letter-spacing: 0.12em; opacity: 0.75; color: #fff; }
      #level-up-power .level-up-power-arrow { opacity: 0.55; font-size: 0.8rem; }
      #level-up-power #level-up-power-delta { color: #7ee28a; }
      /* The gap that mattered most: before this, a bitten hero got no feedback beyond a number in
         the status line. A red glow at the screen EDGES -- the "damage vignette" convention, see
         combat/feedback.js -- because it has to register without the child looking at the bar in
         the corner. Fast in, slower fade out: the [data-shown="true"] rule below overrides the base
         transition so the rise reads as sudden and the decay reads as a fade. */
      #hero-hurt-flash {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgb(200 20 20 / 65%) 100%);
        opacity: 0; transition: opacity 420ms ease-out;
      }
      #hero-hurt-flash[data-shown="true"] { opacity: 1; transition: opacity 40ms ease-in; }
      /* GP1-C5: BEING KNOCKED OUT, which until now was a sentence in the banner and nothing else.
         The brief: "impossible to confuse with ATTACK failing -- the player must instantly understand
         I got knocked out; now I'm coming back."
         Two halves, because that is two statements. The veil is the first: it is deliberately NOT the
         red of #hero-hurt-flash above -- red already means "you just took a hit", and reusing it here
         would say the same thing louder instead of something new. It is a cold, heavy darkness that
         covers the WHOLE frame rather than glowing at the edges, so the difference from a hit is
         obvious with no reading and no colour-vision assumptions: a hit rims the screen, going down
         drowns it.
         The bar is the second half, and it is the half that says "coming back". Without it a dark
         screen and a dead ATTACK button are exactly what a broken game looks like; a bar visibly
         crossing the screen is a promise with a deadline on it. Its duration is not written here --
         main.js sets it from encounter.js's own RESPAWN_SECONDS, so the promise cannot come untrue by
         someone retuning the rules. */
      #hero-down-veil {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgb(8 12 22 / 62%) 0%, rgb(4 6 12 / 88%) 100%);
        opacity: 0; transition: opacity 420ms ease-out;
      }
      #hero-down-veil[data-shown="true"] { opacity: 1; transition: opacity 120ms ease-in; }
      /* Anchored to #banner's OWN 68% line, not to the bottom of the frame. The first version placed
         it with padding-bottom: 34%, which is 34% of the VIEWPORT HEIGHT -- so it happened to land
         under the message in portrait and floated 130px above it in landscape, detached, sitting
         across the hero and the wolf. Caught by the landscape sanity pass, which is the entire reason
         that pass exists (.local/runtime-test/fight-landscape-hero-down.png, before this). Sharing
         the banner's percentage means the two now move together in any frame shape. */
      #hero-down-bar {
        position: absolute; top: calc(68% + 3.4rem); left: 50%; transform: translateX(-50%);
        width: min(48vw, 260px); height: 10px; border-radius: 999px;
        background: rgb(255 255 255 / 22%); overflow: hidden;
      }
      /* Grows left-to-right from nothing to full. transform, not width, so it is composited rather
         than re-laid-out every frame of a 2s fill. */
      #hero-down-bar::after {
        content: ""; display: block; height: 100%; border-radius: 999px;
        background: rgb(242 179 61 / 92%);
        transform: scaleX(0); transform-origin: left center;
      }
      /* The transition lives ONLY on the shown state, which is doing two jobs. Going down, adding the
         transition and the new transform in the same rule is what starts the fill. Getting up, the
         rule stops applying, so the bar snaps back to empty instead of politely un-filling itself
         over two seconds while the boy is already swinging again. --hero-down-seconds is written by
         main.js from encounter.js's RESPAWN_SECONDS; the fallback is only for a bar that somehow
         shows before that runs. */
      #hero-down-veil[data-shown="true"] #hero-down-bar::after {
        transform: scaleX(1);
        transition: transform var(--hero-down-seconds, 2s) linear;
      }
      /* W1: the keeper's line, kid-large text matching banner's own weight/size discipline (not
         the smaller runtime-status pill -- this is read, not glanced at). Centred, but NOT in the
         top row with hero-health/lantern-marks/perf-hud: a first version sat at top:0.75rem and
         drive-village.mjs's own capture caught it sitting almost entirely BEHIND perf-hud's panel,
         whose GPU string wraps to several lines and can span nearly the full width on a narrow
         phone -- found the same "step back and look at the whole picture" way Phase V's ground.js
         placeholder boxes were. 9rem clears every measured perf-hud height with margin and still
         sits well above #banner's 22%, so the two can coexist without stacking. Hidden (opacity 0,
         pointer-events none) far from the keeper; shown (and clickable, for the speaker button)
         within KEEPER_WAVE_RADIUS_METERS -- see world/keeperSpeech.js's keeperSpeechState, the one
         function that decides both. */
      #keeper-speech {
        position: absolute; top: 9rem; left: 50%; transform: translateX(-50%);
        max-width: min(28rem, calc(100% - 12rem));
        display: flex; align-items: center; gap: 0.6rem;
        padding: 0.5rem 0.7rem; border-radius: 0.5rem;
        background: rgb(12 20 31 / 85%); color: #fff;
        font: 700 1.05rem/1.35 system-ui, sans-serif; text-align: left;
        opacity: 0; transition: opacity 200ms ease-out; pointer-events: none;
      }
      #keeper-speech[data-shown="true"] { opacity: 1; pointer-events: auto; }
      #keeper-speech-body { flex: 1 1 auto; }
      /* The name reads as a label, not as part of the sentence: smaller, warm, and on its own line
         so the child's eye starts at the words they actually have to read. */
      #keeper-speech-name {
        display: block; color: #f2b33d; font-size: 0.78rem; letter-spacing: 0.06em;
        text-transform: uppercase; margin-bottom: 0.15rem;
      }
      #keeper-speech-text { display: block; }
      /* >=44px touch target, same discipline as #attack-button. A tap fires speechSynthesis.speak()
         from inside its own click handler -- iOS Safari counts that tap itself as the user gesture,
         so no separate unlock step is needed (see keeperSpeech.js's speakKeeperLine comment). */
      /* GOLD, like every other control a child is meant to find -- #hero-button, #profile-chip and
         the ATTACK ring all say "press me" in #f2b33d and this one said it in translucent white.
         It is the button that matters most on this screen and it was the quietest: read-aloud is
         the ONLY route by which a child who cannot read receives the quest, the count of marks
         left, or where to go next, and since keeperSpeech.js's unlock latch it is also the one tap
         that makes every later line read itself. A control that buys all of that should not be
         styled below the one that opens the gear screen. */
      #keeper-speech-speak {
        flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 75%); border-radius: 50%;
        background: rgb(12 20 31 / 75%); color: #f2b33d;
        font-size: 1.3rem; line-height: 1; padding: 0;
        touch-action: none; user-select: none; -webkit-user-select: none;
        transition: background-color 90ms ease-out;
      }
      #keeper-speech-speak[data-pressed="true"] { background: rgb(242 179 61 / 30%); }
      /* Moved from top:22% to 68%, both steps found by looking at captures rather than by reasoning
         about layout. At 22% the banner sat exactly across the Lantern Tree's canopy, so the one
         moment the whole quest builds to announced itself by covering the thing you are meant to be
         watching (moment-07-relight-t0800.png). 58% was better but still landed on the hero and the
         wolf whenever the camera framed them low -- the Wildwood Gate capture caught it covering a
         live fight (moment-14-wildwood-gate.png). 68% is below every framing of the hero seen so
         far and still well above #runtime-status and both 112px thumb controls. */
      #banner {
        position: absolute; top: 68%; left: 50%; transform: translateX(-50%);
        padding: 0.5rem 1.1rem; border-radius: 0.5rem;
        color: #fff; background: rgb(12 20 31 / 82%);
        font: 800 1.5rem/1.2 system-ui, sans-serif; text-align: center; white-space: nowrap;
        opacity: 0; transition: opacity 220ms ease-out; pointer-events: none;
      }
      #banner[data-shown="true"] { opacity: 1; }
      /* One per landed hit -- a wolf-hit was otherwise only visible as its spark dimming one notch,
         readable if you already know to look, invisible mid-swing. #damage-numbers is a plain
         inset:0 layer so children are positioned in the same pixel space main.js's projection maths
         already targets (the game surface's own rect); the rise is transform, not top/left, so it
         never fights the JS-set spawn position each one starts from. */
      #damage-numbers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .damage-number {
        position: absolute; transform: translate(-50%, -50%);
        color: #fff; font: 800 2.4rem/1 system-ui, sans-serif;
        -webkit-text-stroke: 3px rgb(12 20 31 / 88%); paint-order: stroke fill;
        /* GP1-C5: the glow was red. Red is what the screen does when the WOLF hurts YOU
           (#hero-hurt-flash above), so an outgoing hit that also glowed red taught the two events the
           same colour -- the exact thing the brief says not to do. It is now the hit burst's own warm
           gold, which makes the whole outgoing language one colour: ring, number, and the light that
           leaves the wolf when it dies. Bigger and more heavily stroked for the same reason the ring
           exists at all: this is read at a tenth of frame height, over pale grass. */
        text-shadow: 0 3px 4px rgb(0 0 0 / 55%), 0 0 14px rgb(255 242 196 / 85%);
        opacity: 1; transition: transform 750ms ease-out, opacity 750ms ease-out;
      }
      .damage-number[data-rise="true"] { transform: translate(-50%, -260%); opacity: 0; }
      /* R1: the kill's own "+20 XP" toast, riding the SAME #damage-numbers overlay and the SAME
         spawn/rise mechanics (main.js's popDamageNumber and its new popXpToast share the projection
         plumbing) -- but a distinct COOL colour, never the damage number's warm gold, so a young
         player never reads a reward as a second hit landing. */
      .xp-toast {
        position: absolute; transform: translate(-50%, -50%);
        color: #cfe9ff; font: 800 1.7rem/1 system-ui, sans-serif;
        -webkit-text-stroke: 3px rgb(12 20 31 / 88%); paint-order: stroke fill;
        text-shadow: 0 3px 4px rgb(0 0 0 / 55%), 0 0 14px rgb(122 196 255 / 85%);
        opacity: 1; transition: transform 900ms ease-out, opacity 900ms ease-out;
      }
      .xp-toast[data-rise="true"] { transform: translate(-50%, -320%); opacity: 0; }
      /* E2: compact projected identity for nearby ordinary enemies. This is deliberately one small
         label per stable enemy id, not a dashboard: the layer is bounded by main.js's useful-world
         distance and hides off-screen/dead enemies. DANGER is text as well as red treatment so a
         Level-4 gap cannot be missed by a child who does not distinguish colours reliably. */
      #enemy-nameplates { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .enemy-nameplate {
        position: absolute; transform: translate(-50%, -100%); min-width: 4.2rem;
        padding: 0.22rem 0.34rem 0.28rem; border: 1px solid rgb(255 255 255 / 28%);
        border-radius: 0.32rem; background: rgb(12 20 31 / 82%); color: #fff;
        font: 800 0.68rem/1.1 system-ui, sans-serif; text-align: center;
        text-shadow: 0 1px 2px rgb(0 0 0 / 90%);
      }
      .enemy-nameplate-name, .enemy-nameplate-level, .enemy-nameplate-danger { display: block; }
      .enemy-nameplate-level { color: #f2d28d; font-size: 0.62rem; margin-top: 0.08rem; }
      .enemy-nameplate-danger { min-height: 0.7em; color: #ff6b6b; font-size: 0.57rem; letter-spacing: 0.08em; }
      .enemy-nameplate-health { display: block; height: 0.2rem; margin-top: 0.15rem; overflow: hidden; border-radius: 999px; background: rgb(255 255 255 / 24%); }
      .enemy-nameplate-health > span { display: block; height: 100%; background: #83d77b; transform-origin: left center; }
      /* R1: the Alpha's own subtle menace, independent of the level-vs-hero danger threshold below --
         enemies/enemyKindPresentation.js is the one home for which kinds carry this. Deliberately
         quieter than the DANGER rule beneath it (which stays the louder, brighter warning): a
         same-level Alpha should still read as meaner than a Wolf beside it without shouting over a
         genuine over-level danger card when a child happens to meet both at once -- equal-specificity
         source order (this rule first) is what lets the danger rule win when both apply. */
      .enemy-nameplate[data-menacing="true"] { border-color: rgb(255 122 92 / 65%); box-shadow: 0 0 0.4rem rgb(255 78 46 / 35%); }
      .enemy-nameplate[data-menacing="true"] .enemy-nameplate-name { color: #ffb199; }
      .enemy-nameplate[data-danger="true"] { border-color: rgb(255 91 91 / 88%); box-shadow: 0 0 0.55rem rgb(255 45 45 / 48%); }
      .enemy-nameplate[data-danger="true"] .enemy-nameplate-health > span { background: #ff6262; }
      @media (max-width: 32rem) {
        .enemy-nameplate { min-width: 3.7rem; padding: 0.17rem 0.27rem 0.22rem; font-size: 0.61rem; }
        .enemy-nameplate-level, .enemy-nameplate-danger { font-size: 0.53rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        #attack-button, #attack-button::after, #banner, #hero-hurt-flash, #hero-down-veil, #hero-down-bar::after, #hero-health, #hero-health .health-fill, #hero-health[data-regen="true"], #hero-progress, #hero-progress .xp-fill, #lantern-marks, #lantern-marks .mark, #keeper-speech, #quest-objective, .damage-number, .xp-toast, #loot-hud .loot-count, #streak-meter, #streak-meter[data-pulse="true"], #streak-meter[data-pulse="tier"], #workshop-interact, #objective-marker-glyph { transition: none; animation: none; }
        /* THE CEREMONY STILL HAPPENS UNDER REDUCED MOTION -- it just stops moving.
           The contract's requirement is that "essential Level/HP/POWER information must remain
           legible when motion is reduced; animation is enhancement, not the only communication
           channel". So the card is not hidden here: it appears, holds for its full duration and
           goes, carrying every number it always carried. What is removed is the scale-in, the glow
           pulse and the fade -- the parts that are decoration. A reduced-motion setting is a request
           for less movement, not for less game. */
        #level-up, #level-up-card, #level-up-title { transition: none; animation: none; }
        #level-up[data-shown="true"] #level-up-card { transform: none; }
      }
      /* Y/Task F2: debug-only, hidden by default -- the GPU/frame-cost panel was competing with the
         game and Keeper dialogue in every capture (found by looking at village-keeper-wave.png-style
         shots, not assumed). data-debug follows this file's own [data-shown]/[data-filled] convention
         for JS-driven visibility rather than a one-off display toggle. main.js sets it once at
         startup from ?debug=1 in the URL -- normal child-facing play never has that param, so the
         panel stays gone; a runtime-test harness that wants performance evidence in its own capture
         opts in by navigating with it, same as any other query param. The element and its live
         textContent updates keep running underneath either way (no test/harness parses this text
         programmatically -- checked before hiding it -- so this only affects what a screenshot shows). */
      #perf-hud { position: absolute; top: 0.75rem; right: 0.75rem; max-width: min(34rem, calc(100% - 2rem)); padding: 0.45rem 0.6rem; color: #fff; background: rgb(12 20 31 / 78%); border-radius: 0.35rem; white-space: pre-wrap; font: 600 0.7rem/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; touch-action: none; }
      #perf-hud[data-debug="false"] { display: none; }
      /* GP1: the Hero screen. Gold border/text throughout -- section 33's own colour doctrine,
         "warm gold = reward/ownership" -- so it reads as the same visual family as an equip flourish
         before a child ever opens it. Top-right, the same corner #perf-hud sits in (debug-hidden by
         default, so that corner is otherwise empty during real play): out of the thumbs' way, same
         44px+ touch-target discipline as #keeper-speech-speak. */
      #hero-button {
        position: absolute; top: 0.75rem; right: 0.75rem; width: 52px; height: 52px;
        display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 75%); border-radius: 50%;
        background: rgb(12 20 31 / 75%); color: #f2b33d;
        font-size: 1.5rem; line-height: 1; padding: 0;
        touch-action: none; user-select: none; -webkit-user-select: none;
        transition: background-color 90ms ease-out, transform 90ms ease-out;
      }
      #hero-button[aria-pressed="true"] { background: rgb(242 179 61 / 30%); transform: scale(0.94); }
      /* The screen itself is NOT a solid overlay: pointer-events none on the container, auto only on
         its own chrome (header/slots/list/card below). The centre stays clickable straight through
         to #game, so the SAME cameraGesture already bound to #game (input/cameraGesture.js) keeps
         working underneath -- while this screen is up main.js routes that drag to the PREVIEW's own
         turntable instead of the world camera, so dragging the empty middle turns your guy around.
         That is GP1's "actual 3D equipped hero preview" (plan section 8): the running game IS the
         preview, not a second WebGL context -- see main.js's own comment for why a second renderer
         was rejected (iOS Safari's WebGL context ceiling, unnecessary risk on the testers' actual
         iPads).

         NO BACKGROUND HERE, deliberately. This used to carry a radial-gradient vignette, because the
         Hero screen can open anywhere in the world and there is no camera heading that guarantees a
         clean backdrop. GP1-C3 moved that job INSIDE the renderer (render/heroPreview.js's backdrop
         card): a DOM gradient is composited over the whole canvas, so it dims the hero as much as the
         clutter behind him, and it could never do anything about world geometry standing in FRONT of
         him -- which is what the captures at the Workshop and the Lantern Tree actually showed. The
         card sits behind the hero and in front of the world, which a DOM layer cannot. Two vignettes
         would only double-darken the subject, so this one is gone rather than merely reduced. */
      #hero-screen {
        position: absolute; inset: 0; pointer-events: none;
        opacity: 0; transition: opacity 180ms ease-out;
      }
            /* SHOWN CHANGES OPACITY, NOT HIT-TESTING. This rule used to add `pointer-events: auto`, which

         the top-right button that OPENED this panel became untappable (the Owner found exactly that
         on a real iPhone with his son -- the panel swallowed the tap, so the only way out was the
         small X), and the "centre stays clickable straight through to #game" camera drag stopped
         working while the panel was up.

         itself, and in CSS a descendant re-enables hit-testing under a `none` ancestor -- which is

      #hero-screen[data-shown="true"] { opacity: 1; }
      /* THE DESCENDANT RULE IS NOT OPTIONAL. `pointer-events: none` on this container does NOT make

         itself -- and in CSS a descendant may re-enable hit-testing under a `none` ancestor. So a

      #hero-screen[data-shown="false"] { pointer-events: none; }
      #hero-screen[data-shown="false"] * { pointer-events: none; }
      /* CLEARANCE FOR **BOTH** TOP-RIGHT BUTTONS, which is what that corner now holds.

         and was written when #hero-button was the only control up there. #village-board-button has
         since joined it at `right: calc(0.75rem + 52px + 0.5rem)`, i.e. spanning 76px to 128px from
         the right edge. The header's own right edge sat at 68px, so #hero-screen-close landed
         underneath the map button and a child looking for the X found the map icon instead. That is
         the Owner's real-iPhone report: HERO, map and sword visible, no way out.
         #village-board-header already reserves for both buttons; this is the same arithmetic, and
         the two now agree rather than one of them silently predating the second button. */
      #hero-screen-header {
        position: absolute; top: 0.75rem; left: 0.75rem;
        right: calc(0.75rem + 52px + 52px + 1rem);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.4rem 0.7rem; border-radius: 0.5rem;
        background: rgb(12 20 31 / 82%); color: #f2b33d;
        font: 800 1.1rem/1.2 system-ui, sans-serif; letter-spacing: 0.06em;
        pointer-events: auto;
      }
      /* 48 px, not 36. A five-year-old's tap lands within about a centimetre of where they aimed,
         and these two were the only controls in the game under the original 44px floor -- flagged in
         the Checkpoint 0 audit, and flagged again by the profile gate's own CSS comment below, which
         held every one of ITS targets at 44 while these stayed short. Raised past that floor to 48
         after the real-iPad playtest (task 6): the close button is the one control a stranded child
         MUST be able to hit, so it gets margin above the platform minimum rather than exactly meeting
         it. The ✕ glyph is left at 1.1rem: what has to grow is the thing a thumb has to hit, not the
         thing an adult reads. */
      #hero-screen-close {
        width: 48px; height: 48px; display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 55%); border-radius: 50%;
        background: transparent; color: #fff; font-size: 1.1rem; line-height: 1; padding: 0;
        touch-action: none;
      }
      /* One box per slot, gold-ringed and named when filled, dim and lock-glyphed when GP1 has no
         item to put there yet -- section 8's five slots, only Weapon interactive today. */
      .hero-slot {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
        width: 4.4rem; height: 4.4rem; padding: 0.3rem;
        border: 2px solid rgb(242 179 61 / 55%); border-radius: 0.6rem;
        background: rgb(12 20 31 / 78%); color: #fff;
        font: 700 0.68rem/1.1 system-ui, sans-serif; text-align: center;
      }
      .hero-slot::before {

        background: var(--slot-swatch, transparent);
      }
      .hero-slot[data-locked="true"] {

      }
      .hero-slot[data-locked="true"]::before { content: '🔒'; background: none; font-size: 1.1rem; }

      #hero-slots {
        position: absolute; display: flex; gap: 0.5rem; pointer-events: auto;
      }
      #hero-item-list {
        display: flex; gap: 0.5rem; overflow-x: auto; pointer-events: auto;
      }
      .hero-item {
        flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
        width: 4.6rem; padding: 0.4rem 0.3rem; border-radius: 0.5rem;

        font: 700 0.65rem/1.15 system-ui, sans-serif; text-align: center;

      .hero-item-swatch {

      .hero-item-equipped-tag { color: #f2b33d; font-size: 0.55rem; letter-spacing: 0.05em; }
      /* P2: the Hero screen's own identity panel -- Level and POWER prominently, per the contract's
         "prominently on the Hero/equipment surface", with the two REAL combat stats under them.
         Positioned per orientation below, beside the slots, so it reads as part of the same header
         band rather than as a fourth floating dock. */
      #hero-identity {
        display: flex; flex-direction: column; gap: 0.15rem; pointer-events: none;

      #hero-identity-power {

        color: #ffd76e; font: 900 1.5rem/1.1 system-ui, sans-serif;

      #hero-item-card {

      #hero-item-damage { font: 700 0.85rem/1.2 system-ui, sans-serif; opacity: 0.85; }
      /* Child-readable "1 -> 2 DAMAGE" (section 8's own worked example). Gold when it is an upgrade
         -- the only comparison GP1 can produce, since a strictly worse owned weapon is not a case
         this item table has, but the flag is read rather than assumed so that stays true by
         construction, not by luck (see hero-screen.test.mjs's own sabotage case for this). */
      #hero-item-compare { font: 800 1.15rem/1.2 system-ui, sans-serif; color: #f2b33d; min-height: 1.2em; }
      #hero-equip-button {
        margin-top: 0.2rem; padding: 0.5rem 0.8rem; border-radius: 0.4rem; border: none;
        background: #f2b33d; color: #182331; font: 800 0.85rem/1 system-ui, sans-serif; letter-spacing: 0.05em;
      }
      #hero-equip-button[data-shown="false"] { display: none; }
      #hero-equip-button:disabled { opacity: 0.5; }
      /* Landscape (section 8): slots left, hero preview centre (the live game canvas, clear), item
         list + card right. Portrait: header top, slots as a row just under it, list + card docked to
         the bottom -- the preview lives in the clear band between, which is the tallest single gap
         available once both docks are pinned to an edge instead of the middle. */
      @media (orientation: landscape) {
        #hero-slots { top: 4.5rem; left: 0.75rem; flex-direction: column; }
        /* Bottom-left, under the slot column: the one corner both docks leave clear in landscape,
           and directly opposite the item card so a child comparing a weapon can see what they
           currently ARE without their thumb crossing the preview. */
        #hero-identity { position: absolute; left: 0.75rem; bottom: 0.75rem; }
        #hero-item-list { position: absolute; right: 0.75rem; bottom: 8.5rem; top: 4.5rem; flex-direction: column; width: 5.4rem; }

        /* Directly under the slot row and above the preview band, centred: in portrait the eye
           travels top-to-bottom, so "who you are" belongs between the gear you are wearing and the
           gear you are choosing. */
        #hero-identity { position: absolute; top: 9.6rem; left: 0.75rem; right: 0.75rem; }
        #hero-item-list { position: absolute; left: 0.75rem; right: 0.75rem; bottom: 6.5rem; }
        #hero-item-card { position: absolute; left: 0.75rem; right: 0.75rem; bottom: 0.75rem; }

      /* GP3: the Village Board. Same gold-accent/dark-pill family as the Hero screen just above --

         menu buttons as one visual family before ever opening either. Positioned LEFT of #hero-button
         rather than stacked under it (where #loot-hud already sits): two same-size circles sharing
         the top-right row, a small gap apart. */
      #village-board-button {
        position: absolute; top: 0.75rem; right: calc(0.75rem + 52px + 0.5rem); width: 52px; height: 52px;
        display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 75%); border-radius: 50%;
        background: rgb(12 20 31 / 75%); color: #f2b33d;
        font-size: 1.4rem; line-height: 1; padding: 0;
        touch-action: none; user-select: none; -webkit-user-select: none;

      /* Same "pointer-events none on the container, auto only on its own chrome" split #hero-screen

         working for, but the same vignette/backdrop treatment still reads correctly over any world
         geometry the Board happens to open above. */
      #village-board-screen {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 32%, rgb(12 20 31 / 62%) 100%);
        opacity: 0; transition: opacity 180ms ease-out;
      }
            /* SHOWN CHANGES OPACITY, NOT HIT-TESTING. This rule used to add `pointer-events: auto`, which

         the paragraph above, which promises the opposite, and costing two things a child can feel:
         the top-right button that OPENED this panel became untappable (the Owner found exactly that

      #village-board-screen[data-shown="true"] { opacity: 1; }
      #village-board-screen[data-shown="false"] { pointer-events: none; }
      /* Same defect, same fix -- see #hero-screen's own comment above. This screen's chrome sets

      #village-board-screen[data-shown="false"] * { pointer-events: none; }
      #village-board-header {
        position: absolute; top: 0.75rem; left: 0.75rem; right: calc(0.75rem + 52px + 52px + 1rem);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0.4rem 0.7rem; border-radius: 0.5rem;
        background: rgb(12 20 31 / 82%); color: #f2b33d;
        font: 800 1.1rem/1.2 system-ui, sans-serif; letter-spacing: 0.06em;
        pointer-events: auto;
      }
      /* 48 px -- same reason and same history as #hero-screen-close's own comment above. */
      #village-board-close {
        width: 48px; height: 48px; display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 55%); border-radius: 50%;
        background: transparent; color: #fff; font-size: 1.1rem; line-height: 1; padding: 0;
        touch-action: none;
      }
      /* One box per node, section 4's own five. Gold-ringed when actionable (Workshop today), dim
         when future ("not yet" communicated by treatment, not by a fabricated lock icon implying a
         mechanic that does not exist yet -- see boardScreen.js's own comment on this). */
      .village-board-node {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.2rem;
        width: 6rem; height: 4.6rem; padding: 0.4rem;
        border: 2px solid rgb(242 179 61 / 40%); border-radius: 0.6rem;
        background: rgb(12 20 31 / 78%); color: #fff;
        font: 700 0.72rem/1.15 system-ui, sans-serif; text-align: center;
      }

      .village-board-node[data-kind="future"] { border-color: rgb(255 255 255 / 22%); opacity: 0.6; }
      .village-board-node[data-selected="true"] { background: rgb(242 179 61 / 18%); }
      .village-board-node-label { display: block; font-weight: 800; }
      .village-board-node-status { display: block; opacity: 0.75; font-size: 0.62rem; margin-top: 0.1rem; }
      #village-board-nodes {

      }
      #village-board-detail {

        min-width: 11rem;
