<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>GalaQuest Runtime Slice</title>
    <!-- Zero-network: a bare "no icon yet" declaration, not a real icon asset (Y/Task F1). Without
         this, a browser with no <link rel="icon"> still auto-requests /favicon.ico and logs a 404 --
         every runtime-test harness has carried a "cosmetic, ignore it" allowlist entry for exactly
         this since Phase V. A transparent 1x1 data URI costs one request-free string, not a fetch. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22/>">
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #182331; touch-action: none; overscroll-behavior: none; }
      #game { position: relative; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
      #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* Bottom CENTRE. It was bottom-right, chosen because the perf HUD spans the full width of a
         390px phone and a top-left status line sat unreadable underneath it. The attack button now
         claims the bottom-right — that corner is where the right thumb rests, so it belongs to the
         primary action, not to a readout. Centre is the "lower" zone: least reachable, which is
         exactly right for something you read and never press. */
      #runtime-status {
        position: absolute; bottom: 0.75rem; left: 50%; transform: translateX(-50%);
        max-width: calc(100% - 17rem); padding: 0.4rem 0.6rem;
        color: #fff; background: rgb(12 20 31 / 75%); border-radius: 0.35rem;
        font: 700 0.8rem/1.2 system-ui, sans-serif; text-align: center;
        touch-action: none; pointer-events: none;
      }
      /* DEVELOPER TELEMETRY, hidden in play -- the same data-debug convention #perf-hud already uses,
         because a second mechanism for "show this only to a developer" is a second thing to keep
         true. This line read `you (14.2,-3.1) · wolf 3hp · you 4hp · players 1` permanently, over
         the game, for the whole session. None of it is for a child: their health is the bar, the
         wolf's is the bar over the wolf, and the coordinates and player count are for me.

         BUT NOT WHEN IT IS A FAULT. The same element carries the four things that get said when the
         game breaks -- context lost, hero load failed, bootstrap failed. Those are the one case
         where the text is worth more than the clutter, so data-fault overrides the hide. They are
         still developer-worded, and making them child-readable is a real error screen and a
         separate piece of work; hiding them would be shipping LESS than that, not more.

         Harnesses are unaffected: eighteen of them read this element's textContent, which CSS does
         not touch. #perf-hud's own comment records that same check being made before it was hidden. */
      #runtime-status[data-debug="false"]:not([data-fault="true"]) { display: none; }
      /* Mirrors the stick: same size, same inset, opposite corner. Microsoft's touch-layout guidance,
         drawn from over 200 streamed titles, reserves the right inner wheel for exactly ONE control —
         the most frequent action — with a large hit area, and warns that thumbs cannot reach far
         toward the centre of the screen. So: primary attack, big, out at the grip. */
      #attack-button {
        position: absolute; right: 1rem; bottom: 1rem; width: 112px; height: 112px;
        display: grid; place-items: center;
        border: 2px solid rgb(255 255 255 / 55%); border-radius: 50%;
        background: rgb(196 92 62 / 42%); color: #fff;
        font: 800 1.05rem/1 system-ui, sans-serif; letter-spacing: 0.04em;
        touch-action: none; user-select: none; -webkit-user-select: none;
        transition: transform 90ms ease-out, background-color 90ms ease-out;
      }
      #attack-button[data-pressed="true"] { background: rgb(226 122 84 / 78%); transform: scale(0.94); }
      /* GP1: hidden, not merely disabled, while the Hero screen is open -- main.js's own onOpenChange
         sets this, matched by the SAME frame-loop input gate (heroScreenOpen) that force-zeroes
         movement and attack, so this is belt-and-braces the same way #attack-button[data-ready] is:
         a visual promise checked by real logic, not the only thing enforcing it. */
      #touch-stick[data-suspended="true"], #attack-button[data-suspended="true"] {
        opacity: 0; pointer-events: none; transition: opacity 150ms ease-out;
      }
      /* Found by looking at a real capture (hero-screen-portrait-open.png): the slots row and
         Aldric's speech bubble both sit centred in roughly the same vertical band, so opening Hero
         while standing near an NPC read as the two fighting for the same space. #game carries
         data-hero-screen-open (main.js's onOpenChange, same pattern as the button-suspend attributes
         above) rather than putting this on #hero-screen itself, because keeper-speech/quest-objective
         are EARLIER siblings in the DOM and a CSS sibling combinator only reaches forward. A full-
         screen modal hiding transient background HUD text is standard, not a scope add -- the world
         keeps simulating underneath (this is still non-blocking), only the text callouts pause. */
      #game[data-hero-screen-open="true"] #keeper-speech,
      #game[data-hero-screen-open="true"] #quest-objective,
      #game[data-hero-screen-open="true"] #banner,
      #game[data-hero-screen-open="true"] #hero-health,
      #game[data-hero-screen-open="true"] #lantern-marks,
      #game[data-hero-screen-open="true"] #loot-hud {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* MODAL ISOLATION, SECOND HALF: the navigation layer gets out of the way too.
         The rule above already hid the transient TEXT callouts. Exact-SHA browser captures at the
         frozen child baseline still showed the minimap and "Show me where" sitting behind a
         full-screen panel, and the OTHER panel's button competing in the same top-right row -- so a
         child looking at the Hero screen still had a map, an arrow, a rescue button and a second
         menu icon arguing with it. Subtracting competing HUD, not adding any.
         The inactive sibling button goes with them: while Hero owns the screen the map button is not
         an escape, it is the thing that was covering the X. The ACTIVE panel keeps its own toggle
         (so the button that opened it still closes it) and its own X. */
      #game[data-hero-screen-open="true"] #minimap,
      #game[data-hero-screen-open="true"] #objective-pointer,
      #game[data-hero-screen-open="true"] #guidance-rescue,
      #game[data-hero-screen-open="true"] #village-board-button {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* GP3: the Village Board hides the identical set of transient HUD text, for the identical
         reason -- a second full-screen overlay competing with keeper-speech/quest-objective for the
         same on-screen space. Its own attribute rather than folding into [data-hero-screen-open]
         above: the two screens are mutually exclusive (main.js closes one before opening the other),
         but keeping each screen's own boolean keeps this rule readable from either screen's own
         onOpenChange without one having to know the other's attribute name. */
      #game[data-village-board-open="true"] #keeper-speech,
      #game[data-village-board-open="true"] #quest-objective,
      #game[data-village-board-open="true"] #banner,
      #game[data-village-board-open="true"] #hero-health,
      #game[data-village-board-open="true"] #lantern-marks,
      #game[data-village-board-open="true"] #loot-hud {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* MODAL ISOLATION, SECOND HALF: the navigation layer gets out of the way too.
         The rule above already hid the transient TEXT callouts. Exact-SHA browser captures at the
         frozen child baseline still showed the minimap and "Show me where" sitting behind a
         full-screen panel, and the OTHER panel's button competing in the same top-right row -- so a
         child looking at the Hero screen still had a map, an arrow, a rescue button and a second
         menu icon arguing with it. Subtracting competing HUD, not adding any.
         The inactive sibling button goes with them: while Hero owns the screen the map button is not
         an escape, it is the thing that was covering the X. The ACTIVE panel keeps its own toggle
         (so the button that opened it still closes it) and its own X. */
      #game[data-village-board-open="true"] #minimap,
      #game[data-village-board-open="true"] #objective-pointer,
      #game[data-village-board-open="true"] #guidance-rescue,
      #game[data-village-board-open="true"] #hero-button {
        opacity: 0 !important; pointer-events: none !important;
      }
      /* Greyed while the swing is on cooldown, so mashing it reads as "not yet" rather than "broken". */
      #attack-button[data-ready="false"] { opacity: 0.45; }
      /* A whiff reads differently from a hit without any text: nothing happens to the wolf (nothing
         was struck), and the button the child's thumb is already on pulses a flat neutral grey
         instead of its usual orange press colour. After data-pressed so it wins if a slow tap is
         still down when the swing resolves -- see combat/feedback.js for the reasoning. Explicit
         opacity: 1 because a miss always lands during the same cooldown window that dims the button
         to 0.45 -- measured in tools/runtime-test/play-fight.mjs's fight-swing-miss.png capture,
         where the grey was nearly invisible under that dimming until this line was added. A miss is
         more informative than "not ready yet" and must read at full strength over it. */
      #attack-button[data-feedback="miss"] { background: rgb(150 150 150 / 60%); opacity: 1; }
      /* GP1-C5: the grey alone was not enough. The brief is that mashing ATTACK at nothing must not
         feel like the button stopped working, and a colour swap on a control the thumb is COVERING is
         the one piece of feedback a player is guaranteed not to see. So a miss also throws a ring off
         the button, outward past the thumb, where it is visible from the edges. It stays on the
         button rather than touching the wolf on purpose -- a miss is a fact about the player's own
         action, and marking the wolf for a blow that never reached it is the confusion this avoids
         (see combat/feedback.js's own note on Fortnite's hit marker vs WoW's "Miss" text).
         Deliberately position:absolute rather than a grid item: #attack-button centres its label with
         place-items, and a pseudo-element joining that grid would push the label instead of overlaying
         it. */
      #attack-button::after {
        content: ""; position: absolute; inset: 0; border-radius: 50%;
        border: 5px solid rgb(255 255 255 / 92%);
        opacity: 0; transform: scale(1); pointer-events: none;
      }
      #attack-button[data-feedback="miss"]::after { animation: miss-ring 420ms ease-out 1; }
      /* HOLDS before it goes. The first version faded linearly from the instant it appeared, and in
         .local/runtime-test/fight-landscape-swing-miss.png -- the first frame that ever caught this
         at all -- it had already thinned to a barely-there hairline by the time the screenshot
         encoded. A ring that is only bright for the few milliseconds nobody is looking at is not
         feedback. So: full strength through the first 45%, then leave. It also travels less far now
         (1.45 rather than 1.7) -- spreading the same amount of ink over a bigger circle is what made
         it thin, and a ring that stays near the thumb is still clear of it. */
      @keyframes miss-ring {
        0%   { opacity: 1; transform: scale(1); }
        45%  { opacity: 1; transform: scale(1.28); }
        100% { opacity: 0; transform: scale(1.45); }
      }
      /* A BAR AND A NUMBER since P2 -- see combat/feedback.js for why the same reference research
         that once chose a row of hearts now chooses this, and #hero-health's own markup comment for
         what it replaced. Same dark pill treatment as the other HUD readouts so red still reads
         against open sky, and the same fixed top-left anchor so nothing about the status column
         moved. The pill is a FIXED WIDTH regardless of the numbers in it: the bar's length is the
         signal, and a pill that grew as a hero levelled would move the lantern row underneath it. */
      #hero-health {
        position: absolute; top: 0.75rem; left: 0.75rem;
        display: flex; gap: 0.4rem; align-items: center;
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        line-height: 1;
        pointer-events: none; touch-action: none;
      }
      #hero-health .health-icon { color: #e0334f; font-size: 1.15rem; line-height: 1; }
      #hero-health .health-icon::after { content: '\2665'; }
      /* THICK, on purpose: the brief's own word, and the reason is a thumb-held tablet at arm's
         length rather than a monitor. 0.62rem is about the height of the numerals beside it, which is
         what makes the two read as one readout instead of a bar with a caption. */
      #hero-health .health-track {
        display: block; width: 6.5rem; height: 0.62rem; border-radius: 0.31rem;
        background: rgb(255 255 255 / 18%); overflow: hidden;
      }
      #hero-health .health-fill {
        display: block; height: 100%; width: 100%; border-radius: 0.31rem;
        background: linear-gradient(90deg, #e0334f, #ff6b7f);
        transform-origin: left center;
        transition: width 180ms ease-out, background 180ms ease-out;
      }
      /* THE LAST OF IT LOOKS DIFFERENT. A bar that only shortens says "you are losing"; a bar that
         changes colour says "you are nearly out", which is the thing a child needs a beat earlier
         than the geometry alone gives them. Set by main.js off the same fraction that sizes the
         fill, so the two can never disagree about what "low" means. */
      #hero-health[data-low="true"] .health-fill { background: linear-gradient(90deg, #d11f2f, #ff9a3d); }
      #hero-health .health-count { font: 700 0.95rem/1 system-ui, sans-serif; color: #fff; font-variant-numeric: tabular-nums; }
      /* Tabular numerals above and a fixed-width slash here for the same reason: the readout must not
         jitter horizontally as 30 becomes 9 and back. */
      #hero-health .health-slash { opacity: 0.55; margin: 0 0.15rem; }
      /* Beating a wolf gives health back (healTheStanding in combat/encounter.js). The bar refills on
         its own from renderHealth -- this makes the row ANNOUNCE it, because a child watching a wolf
         dissolve eighteen metres away is not looking at the top-left corner. Green, and scaling UP,
         so it cannot be confused with the red damage vignette, which is the other thing that happens
         to this readout and means the opposite. Fast in, slow out, the same shape #hero-hurt-flash
         uses and for the same reason. */
      #hero-health { transform-origin: left center; transition: transform 320ms ease-out, box-shadow 320ms ease-out; }
      #hero-health[data-healing="true"] {
        transform: scale(1.16);
        box-shadow: 0 0 0.85rem 0.15rem rgb(126 226 138 / 75%);
        transition: transform 90ms ease-out, box-shadow 90ms ease-out;
      }
      /* Lantern Marks, D4: three pips directly under the health readout, same dark-pill / same fill
         convention (see combat/feedback.js's health research for why filled-icon-not-a-bar suits a
         small FIXED integer, which MARKS_TO_UNLOCK still is and HERO_MAX_HP no longer is). Read-only
         and out of touch-flow, so the touch-target-size rules elsewhere on this page do not apply.
         Glyph is a plain filled dot, not a lantern pictogram: a placeholder shape like the six
         audio recipes are placeholder sounds -- what it looks like is a later the owner-on-iPad call,
         same as the growl and the other five. */
      #lantern-marks {
        position: absolute; top: calc(0.75rem + 2.5rem); left: 0.75rem;
        display: flex; gap: 0.15rem; align-items: center;
        padding: 0.3rem 0.5rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        font-size: 1.35rem; line-height: 1;
        pointer-events: none; touch-action: none;
      }
      /* GP1-C6: A LANTERN MARK, NOT A DOT.
         These were three U+25CF bullets that changed colour, which is exactly what a Lantern Mark
         must not look like: the reward the whole first chapter is built around read as 'something
         happened to one of the dots'. An empty slot is now a HOLLOW four-point spark and a filled
         one is a SOLID, glowing one -- the same shape as the light that just flew off the wolf and
         into the boy, so the icon and the thing it counts are visibly the same object. Earned vs not
         is now shape AND fill AND glow rather than hue alone, which also means it survives being
         looked at by someone who does not tell gold from grey. */
      #lantern-marks .mark {
        color: rgb(255 255 255 / 28%);
        display: inline-block;
        transition: color 120ms ease-out, text-shadow 200ms ease-out;
      }
      #lantern-marks .mark::after { content: '\2727'; }
      #lantern-marks .mark[data-filled="true"] {
        color: #f2b33d; text-shadow: 0 0 10px rgb(242 179 61 / 90%), 0 0 22px rgb(242 179 61 / 45%);
      }
      #lantern-marks .mark[data-filled="true"]::after { content: '\2726'; }
      /* The moment it lights. main.js sets this for one beat when the mark's own light ARRIVES at
         the boy -- not when the server says the kill counted, which is most of a second earlier and
         is why the reward used to land underneath the kill's own payoff and lose. One pip igniting
         is the smallest thing that can say 'THAT is what you just earned'; it does not need a
         fireworks system, it needs to be the thing moving at the moment nothing else is. */
      #lantern-marks .mark[data-just-lit="true"] { animation: mark-ignite 700ms ease-out 1; }
      @keyframes mark-ignite {
        0%   { transform: scale(1);    filter: brightness(1); }
        18%  { transform: scale(1.85); filter: brightness(2.2); }
        100% { transform: scale(1);    filter: brightness(1); }
      }
      /* ...and the pill it sits in leans in with it, so the eye is PULLED to the corner rather than
         being expected to already be looking there. */
      #lantern-marks[data-just-lit="true"] { animation: mark-pill-lift 700ms ease-out 1; }
      @keyframes mark-pill-lift {
        0%   { background: rgb(12 20 31 / 75%); }
        18%  { background: rgb(78 56 18 / 94%); }
        100% { background: rgb(12 20 31 / 75%); }
      }
      /* GP2: coins and Wildwood Shards, same dark-pill/read-only/out-of-touch-flow treatment as
         hero-health and lantern-marks -- this is the fourth member of the same top-left status
         column, not a new visual language. Top-right rather than stacking under lantern-marks: that
         corner already holds #perf-hud (debug-only, hidden by default) and #hero-button, both far
         enough from the thumbs that a third small pill reads as one status cluster rather than
         crowding the left side where the child's own health/marks live. Two glyphs, not one shared
         "loot" icon -- a filled circle (coin) and a diamond (shard), the same silhouette difference
         the physical pickups themselves use, so a glance at the HUD and a glance at the ground agree
         on what a coin looks like versus what a shard looks like. Deliberately NOT updated the
         instant a server snapshot says the count went up -- main.js only calls renderLootHud() once
         a pickup's own attraction flight has actually arrived (world/lootPickups.js's `update()`
         return value), which is the whole point of GP2's "HUD totals must not update before the
         pickup reaches its collection endpoint" rule. */
      #loot-hud {
        position: absolute; top: calc(0.75rem + 52px + 0.5rem); right: 0.75rem;
        display: flex; gap: 0.5rem; align-items: center;
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        background: rgb(12 20 31 / 75%);
        font: 700 1rem/1 system-ui, sans-serif; color: #fff;
        pointer-events: none; touch-action: none;
      }
      #loot-hud .loot-count { display: inline-flex; align-items: center; gap: 0.3rem; }
      #loot-hud .loot-icon { font-size: 1rem; line-height: 1; }
      #loot-hud .loot-icon::after { content: '\25CF'; }
      #loot-hud .loot-count[data-kind="shard"] .loot-icon { color: #b98be0; }
      #loot-hud .loot-count[data-kind="shard"] .loot-icon::after { content: '\25C6'; }
      #loot-hud .loot-count[data-kind="coin"] .loot-icon { color: #f2c14e; }
      /* Same brief pop-and-settle the health row uses on a heal (#hero-health[data-healing]) -- a
         number that merely changes value is easy to miss in a HUD corner; a number that visibly
         pops is not. Reset by main.js the same way flashHeroHurt's timer is: a fresh setTimeout on
         every arrival, so two pickups landing close together each get their own pop. */
      #loot-hud .loot-count[data-popped="true"] { animation: loot-pop 260ms ease-out; }
      @keyframes loot-pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
      /* The standing objective. Sits directly under #lantern-marks (0.75 + 2.5 for the health row,
         + 2.2 for the pips row), same pill treatment, same read-only/out-of-touch-flow rules. Left
         aligned with the bar and pips so the whole top-left corner reads as one status column. */
      #quest-objective {
        position: absolute; top: calc(0.75rem + 2.5rem + 2.2rem); left: 0.75rem;
        max-width: min(20rem, calc(100% - 10rem));
        padding: 0.3rem 0.55rem; border-radius: 0.35rem;
        color: #fff; background: rgb(12 20 31 / 75%);
        font: 700 0.9rem/1.25 system-ui, sans-serif;
        opacity: 0; transition: opacity 220ms ease-out;
        pointer-events: none; touch-action: none;
      }
      #quest-objective[data-shown="true"] { opacity: 1; }
      /* The gap that mattered most: before this, a bitten hero got no feedback beyond a number in
         the status line. A red glow at the screen EDGES -- the "damage vignette" convention, see
         combat/feedback.js -- because it has to register without the child looking at the bar in
         the corner. Fast in, slower fade out: the [data-shown="true"] rule below overrides the base
         transition so the rise reads as sudden and the decay reads as a fade. */
      #hero-hurt-flash {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 55%, rgb(200 20 20 / 65%) 100%);
        opacity: 0; transition: opacity 420ms ease-out;
      }
      #hero-hurt-flash[data-shown="true"] { opacity: 1; transition: opacity 40ms ease-in; }
      /* GP1-C5: BEING KNOCKED OUT, which until now was a sentence in the banner and nothing else.
         The brief: "impossible to confuse with ATTACK failing -- the player must instantly understand
         I got knocked out; now I'm coming back."
         Two halves, because that is two statements. The veil is the first: it is deliberately NOT the
         red of #hero-hurt-flash above -- red already means "you just took a hit", and reusing it here
         would say the same thing louder instead of something new. It is a cold, heavy darkness that
         covers the WHOLE frame rather than glowing at the edges, so the difference from a hit is
         obvious with no reading and no colour-vision assumptions: a hit rims the screen, going down
         drowns it.
         The bar is the second half, and it is the half that says "coming back". Without it a dark
         screen and a dead ATTACK button are exactly what a broken game looks like; a bar visibly
         crossing the screen is a promise with a deadline on it. Its duration is not written here --
         main.js sets it from encounter.js's own RESPAWN_SECONDS, so the promise cannot come untrue by
         someone retuning the rules. */
      #hero-down-veil {
        position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, rgb(8 12 22 / 62%) 0%, rgb(4 6 12 / 88%) 100%);
        opacity: 0; transition: opacity 420ms ease-out;
      }
      #hero-down-veil[data-shown="true"] { opacity: 1; transition: opacity 120ms ease-in; }
      /* Anchored to #banner's OWN 68% line, not to the bottom of the frame. The first version placed
         it with padding-bottom: 34%, which is 34% of the VIEWPORT HEIGHT -- so it happened to land
         under the message in portrait and floated 130px above it in landscape, detached, sitting
         across the hero and the wolf. Caught by the landscape sanity pass, which is the entire reason
         that pass exists (.local/runtime-test/fight-landscape-hero-down.png, before this). Sharing
         the banner's percentage means the two now move together in any frame shape. */
      #hero-down-bar {
        position: absolute; top: calc(68% + 3.4rem); left: 50%; transform: translateX(-50%);
        width: min(48vw, 260px); height: 10px; border-radius: 999px;
        background: rgb(255 255 255 / 22%); overflow: hidden;
      }
      /* Grows left-to-right from nothing to full. transform, not width, so it is composited rather
         than re-laid-out every frame of a 2s fill. */
      #hero-down-bar::after {
        content: ""; display: block; height: 100%; border-radius: 999px;
        background: rgb(242 179 61 / 92%);
        transform: scaleX(0); transform-origin: left center;
      }
      /* The transition lives ONLY on the shown state, which is doing two jobs. Going down, adding the
         transition and the new transform in the same rule is what starts the fill. Getting up, the
         rule stops applying, so the bar snaps back to empty instead of politely un-filling itself
         over two seconds while the boy is already swinging again. --hero-down-seconds is written by
         main.js from encounter.js's RESPAWN_SECONDS; the fallback is only for a bar that somehow
         shows before that runs. */
      #hero-down-veil[data-shown="true"] #hero-down-bar::after {
        transform: scaleX(1);
        transition: transform var(--hero-down-seconds, 2s) linear;
      }
      /* W1: the keeper's line, kid-large text matching banner's own weight/size discipline (not
         the smaller runtime-status pill -- this is read, not glanced at). Centred, but NOT in the
         top row with hero-health/lantern-marks/perf-hud: a first version sat at top:0.75rem and
         drive-village.mjs's own capture caught it sitting almost entirely BEHIND perf-hud's panel,
         whose GPU string wraps to several lines and can span nearly the full width on a narrow
         phone -- found the same "step back and look at the whole picture" way Phase V's ground.js
         placeholder boxes were. 9rem clears every measured perf-hud height with margin and still
         sits well above #banner's 22%, so the two can coexist without stacking. Hidden (opacity 0,
         pointer-events none) far from the keeper; shown (and clickable, for the speaker button)
         within KEEPER_WAVE_RADIUS_METERS -- see world/keeperSpeech.js's keeperSpeechState, the one
         function that decides both. */
      #keeper-speech {
        position: absolute; top: 9rem; left: 50%; transform: translateX(-50%);
        max-width: min(28rem, calc(100% - 12rem));
        display: flex; align-items: center; gap: 0.6rem;

         the ATTACK ring all say "press me" in #f2b33d and this one said it in translucent white.

         the ONLY route by which a child who cannot read receives the quest, the count of marks
         left, or where to go next, and since keeperSpeech.js's unlock latch it is also the one tap

         moment the whole quest builds to announced itself by covering the thing you are meant to be
         watching (moment-07-relight-t0800.png). 58% was better but still landed on the hero and the
         wolf whenever the camera framed them low -- the Wildwood Gate capture caught it covering a
         live fight (moment-14-wildwood-gate.png). 68% is below every framing of the hero seen so
         far and still well above #runtime-status and both 112px thumb controls. */
      #banner {
        position: absolute; top: 68%; left: 50%; transform: translateX(-50%);
        padding: 0.5rem 1.1rem; border-radius: 0.5rem;
        color: #fff; background: rgb(12 20 31 / 82%);

         readable if you already know to look, invisible mid-swing. #damage-numbers is a plain
         inset:0 layer so children are positioned in the same pixel space main.js's projection maths
         already targets (the game surface's own rect); the rise is transform, not top/left, so it
         never fights the JS-set spawn position each one starts from. */
      #damage-numbers { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .damage-number {
        position: absolute; transform: translate(-50%, -50%);
        color: #fff; font: 800 2.4rem/1 system-ui, sans-serif;

        /* GP1-C5: the glow was red. Red is what the screen does when the WOLF hurts YOU

           gold, which makes the whole outgoing language one colour: ring, number, and the light that
           leaves the wolf when it dies. Bigger and more heavily stroked for the same reason the ring
           exists at all: this is read at a tenth of frame height, over pale grass. */

      /* Y/Task F2: debug-only, hidden by default -- the GPU/frame-cost panel was competing with the
         game and Keeper dialogue in every capture (found by looking at village-keeper-wave.png-style
         shots, not assumed). data-debug follows this file's own [data-shown]/[data-filled] convention
         for JS-driven visibility rather than a one-off display toggle. main.js sets it once at

      #perf-hud { position: absolute; top: 0.75rem; right: 0.75rem; max-width: min(34rem, calc(100% - 2rem)); padding: 0.45rem 0.6rem; color: #fff; background: rgb(12 20 31 / 78%); border-radius: 0.35rem; white-space: pre-wrap; font: 600 0.7rem/1.35 ui-monospace, SFMono-Regular, Consolas, monospace; pointer-events: none; touch-action: none; }

      #hero-button {

      #hero-screen {
        position: absolute; inset: 0; pointer-events: none;
        opacity: 0; transition: opacity 180ms ease-out;

            /* SHOWN CHANGES OPACITY, NOT HIT-TESTING. This rule used to add `pointer-events: auto`, which

         right 0.75rem and sits ON TOP of both the ATTACK button and the movement stick. Open Hero

         hand movement, and document.elementFromPoint at the ATTACK button's own centre answered
         `hero-item-name`. The existing "closing the screen un-suspends the stick and attack button"
         check passed the whole time -- it reads data-suspended, and the attribute was correct while
         the button underneath it was unreachable. tools/runtime-test/drive-hero-screen.mjs now

      #hero-screen[data-shown="false"] { pointer-events: none; }

      #hero-screen-header {

      #hero-screen-close {

      /* GP3: the Village Board. Same gold-accent/dark-pill family as the Hero screen just above --

      #village-board-button {

      /* GP3-C1: the Workshop's own deliberate interaction prompt -- replaces the old "mere proximity

         Workshop's own ceremony having finished, and WORKSHOP_INTERACT range -- this element only
         paints it), positioned in its own vertical band so it can never collide with #keeper-speech
         (9rem) or #banner (68%) if a child somehow lingers where both would be visible. Gold/dark-pill
         family, matching #hero-button/#village-board-button's own "warm gold = reward/ownership"
         doctrine -- the Workshop IS a reward location. */
      #workshop-interact {
        position: absolute; top: 80%; left: 50%; transform: translateX(-50%);
        padding: 0.5rem 1rem; min-height: 44px;
        display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 75%); border-radius: 0.6rem;
        background: rgb(12 20 31 / 85%); color: #f2b33d;
        font: 800 1rem/1.2 system-ui, sans-serif; letter-spacing: 0.05em; white-space: nowrap;
        touch-action: none; user-select: none; -webkit-user-select: none;
        opacity: 0; transition: opacity 200ms ease-out; pointer-events: none;
      }
      #workshop-interact[data-shown="true"] { opacity: 1; pointer-events: auto; }
      #village-board-upgrade-button:disabled { opacity: 0.5; }
      /* Same landscape/portrait split as the Hero screen: nodes docked to one edge, detail docked to
         the opposite/bottom edge, leaving the tallest clear band available in each orientation. */
      @media (orientation: landscape) {
        #village-board-nodes { top: 4.5rem; left: 0.75rem; flex-direction: column; width: 6.5rem; }
        #village-board-detail { position: absolute; right: 0.75rem; bottom: 0.75rem; top: 4.5rem; overflow-y: auto; }
      }
      @media (orientation: portrait) {
        #village-board-nodes { top: 4.5rem; left: 0.75rem; right: 0.75rem; justify-content: center; }
        #village-board-detail { position: absolute; left: 0.75rem; right: 0.75rem; bottom: 0.75rem; }
      }
      /* ── Touch controls, and the devices that should not see them ──────────────────────────
         The stick and ATTACK shipped on EVERY device. On a desktop that is a large obvious control
         that does nothing: input/touch.js listens for touch events, so a click never drives it and
         falls through to the camera drag underneath -- you push the joystick and the world spins.
         A visible control that lies is worse than no control.

         Only a device reporting ZERO touch points loses them; see input/pointerMode.js for why the
         rule is asymmetric and why it is maxTouchPoints rather than a (pointer: coarse) query.
         Nothing on screen had ever said the words WASD, Space, drag or scroll, so the hint takes
         the space the stick vacates rather than being one more thing competing for a corner. */
      #game[data-pointer="mouse"] #touch-stick,
      #game[data-pointer="mouse"] #attack-button { display: none; }
      #desktop-keys {
        position: absolute; left: 50%; bottom: 1rem; transform: translateX(-50%);
        margin: 0; padding: 0.4rem 0.7rem;
        color: rgb(255 255 255 / 82%); background: rgb(12 20 31 / 62%); border-radius: 0.35rem;
        font: 600 0.78rem/1.2 system-ui, sans-serif; white-space: nowrap;
        pointer-events: none; touch-action: none;
      }
      /* Hidden by default rather than shown by default: the attribute is set by main.js at startup,
         and a tablet must never flash a line about a keyboard it does not have while that runs. */
      #desktop-keys { display: none; }
      /* ── Which way to turn ─────────────────────────────────────────────────────────────────
         Measured, not assumed: from the spawn the Keeper sits at NDC (0.37, 0.25) -- comfortably on
         screen -- and ONE 200px thumb-drag, 69 degrees of camera, puts him at NDC x 1.5 and gone.
         The chip still reads "Talk to Keeper Aldric" and the banner still says he is waving, with
         nothing anywhere indicating which way to turn. Swiping to look around is the first thing
         anybody does with a 3D world, so that is not an edge case, it is second three.

         ui/offscreenPointer.js decides where this goes and which way it faces; the header there is
         mostly about why a target BEHIND the camera has to be handled explicitly rather than trusted
         to project sensibly. Hidden whenever the objective is already on screen: an arrow pointing
         at something the child can see is noise, and noise is how a child learns to stop looking. */
      #objective-pointer {
        position: absolute; left: 0; top: 0; width: 44px; height: 44px; margin: -22px 0 0 -22px;
        display: grid; place-items: center;
        pointer-events: none; touch-action: none;
        transition: opacity 140ms ease-out;
      }
      /* ── The dial ───────────────────────────────────────────────────────────────────────────
         Hero at the centre, camera forward pointing UP. Not north-up: a north-up map asks the reader
         to hold a rotation in their head and apply it to their own body, which is a skill children
         get years after they can play this game. Camera-up means a thing drawn to the right of the
         dot is to the child's right, with nothing to work out.

         It draws the ROAD and the current errand. It is NOT enemy radar -- a dial that shows where
         the wolf is turns an encounter a child is supposed to look up and see into a chart they read
         instead. ui/minimap.js owns the maths and says all of this at more length.

         Under the objective chip, in the same left-hand information column, and clear of both thumb
         zones. 110 CSS px backed by a 220 px canvas so it is not soft on a 2x tablet. */
      #minimap {
        position: absolute; left: 0.75rem; top: 7.5rem;
        width: 110px; height: 110px; border-radius: 50%;
        border: 2px solid rgb(242 179 61 / 45%);
        background: rgb(12 20 31 / 62%);
        pointer-events: none; touch-action: none;
      }
      /* ── Offering help, and mostly not offering it ──────────────────────────────────────────
         The arrow only helps a child who looks at it. ui/guidanceRescue.js decides when one has
         stopped getting closer -- not when they have stopped moving, and not when they are walking
         AWAY, because a child rounding a house walks away for four seconds and is not lost while a
         child circling two metres from the Keeper never gets far and is completely lost. It measures
         whether they have ever been nearer than they are now.

         Tapping it turns the camera to face the errand and nothing else. It does not walk them
         there, and it does not turn the camera on its own: camera/follow.js says "the player owns
         the camera" and a rescue that seizes it would be the game taking the one thing a child had
         learned to control. Player-initiated, once, on a tap.

         Above the stick and the ATTACK button rather than between them, and clear of #desktop-keys
         on a desktop. 44 px floor like everything else -- ui/tapTargets.js owns that number. */
      #guidance-rescue {
        position: absolute; left: 50%; bottom: 5rem; transform: translateX(-50%);
        min-height: 44px; padding: 0.55rem 1rem;
        border: 2px solid rgb(242 179 61 / 70%); border-radius: 1.4rem;
        background: rgb(12 20 31 / 88%); color: #fff;
        font: 700 0.92rem/1.1 system-ui, sans-serif; white-space: nowrap;
        transition: opacity 180ms ease-out;
      }
      #guidance-rescue[data-shown="false"] { display: none; }
      #guidance-rescue[data-shown="true"] { display: block; pointer-events: auto; }
      #objective-pointer[data-shown="false"] { opacity: 0; }
      #objective-pointer[data-shown="true"] { opacity: 1; }
      #objective-pointer-arrow {
        display: block; font-size: 1.7rem; line-height: 1; color: #f2b33d;
        text-shadow: 0 0 0.35rem rgb(12 20 31 / 95%), 0 0 0.9rem rgb(12 20 31 / 75%);
      }
      #game[data-pointer="mouse"] #desktop-keys { display: block; }
      /* Both live at bottom-centre, and on a desktop both can be on screen at once -- with ?debug=1,
         or on a fault, which is the one time #runtime-status shows without it. The DEVELOPER line is
         the one that moves: the child-facing hint keeps the natural position. Harmless when the
         status line is hidden, which is almost always. */
      #game[data-pointer="mouse"] #runtime-status { bottom: 3.2rem; }
      #touch-stick { position: absolute; left: 1rem; bottom: 1rem; width: 112px; height: 112px; border: 2px solid rgb(255 255 255 / 55%); border-radius: 50%; background: rgb(18 28 38 / 28%); touch-action: none; }
      #touch-stick-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; border-radius: 50%; background: rgb(255 255 255 / 72%); transform: translate(-50%, -50%); pointer-events: none; }
      /* RUNNING. younger players told us at the first child playtest that their character moved too slowly,
         and the most likely reason is that nothing in this game ever said a harder push was faster
         -- the only feedback for crossing into a run was the hero going faster, which you cannot
         notice if you never crossed. The ring lights and the knob swells under the thumb that is
         already there and already being looked at (input/touch.js sets data-run). Warm, not white,
         so it cannot be mistaken for the plain resting stick at a glance. */
      #touch-stick { transition: border-color 90ms ease-out, box-shadow 90ms ease-out; }
      #touch-stick[data-run="true"] { border-color: rgb(255 208 130 / 95%); box-shadow: 0 0 0.8rem 0.1rem rgb(255 190 96 / 55%); }
      #touch-stick-knob { transition: width 90ms ease-out, height 90ms ease-out, background-color 90ms ease-out; }
      #touch-stick[data-run="true"] #touch-stick-knob { width: 54px; height: 54px; background: rgb(255 224 170 / 92%); }
      /* ── The family profile gate ────────────────────────────────────────────────────────────
         Tablet-first and child-first. Every interactive target here is at or above the 44 px floor
         -- deliberately including the close and remove controls, which is where #hero-screen-close
         and #village-board-close (both 36 px, flagged in the Checkpoint 0 audit) fall short. A
         5-year-old's tap lands within about a centimetre of where they meant it.

         Unlike the Hero screen and the Village Board this one is OPAQUE rather than a vignette over
         the world: it is a question that has to be answered, not an overlay on play, and a
         half-visible village behind it invites a child to try to tap the village. */
      #profile-gate {
        position: absolute; inset: 0; pointer-events: none;
        display: grid; place-items: center;
        background: rgb(9 15 24 / 96%);
        /* Above the HUD, not merely above the world. Found by looking at a capture: the backdrop
           dimmed the village correctly and the health readout, the objective chip, the Hero/Board buttons
           and the loading line all still sat ON TOP of the question. A stacking context is the half
           of "opaque" that a background colour does not give you. */
        z-index: 20;
        opacity: 0; transition: opacity 160ms ease-out;
      }
      #profile-gate[data-shown="true"] { opacity: 1; pointer-events: auto; }
      /* Same closed-overlay trap #hero-screen and #village-board-screen both had to fix: chrome
         inside sets pointer-events auto, so without this a closed gate keeps eating taps aimed at
         the touch stick underneath it. */
      #profile-gate[data-shown="false"] { pointer-events: none; }
      #profile-gate[data-shown="false"] * { pointer-events: none; }
      #profile-gate-panel {
        width: min(92vw, 560px); max-height: 88vh; overflow-y: auto;
        padding: 1.1rem 1.1rem 1.3rem;
        display: flex; flex-direction: column; gap: 0.9rem;
      }
      /* Deliberately bigger than .profile-card-face's 52px: on the chooser the animal identifies one
         hero among several, here it IS the screen's subject and the only thing on it a pre-reader
         can hold on to. Centred, so a child looking at a mostly-empty panel looks at it first. */
      #profile-gate-face {
        width: 96px; height: 96px; border-radius: 50%; margin: 0 auto 0.15rem;
        display: grid; place-items: center; font-size: 3.1rem; line-height: 1;
        box-shadow: inset 0 0 0 3px rgb(255 255 255 / 22%);
      }
      #profile-gate-face[data-shown="false"] { display: none; }
      #profile-gate-header { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
      #profile-gate-title {
        margin: 0; color: #f2b33d;
        font: 800 1.5rem/1.15 system-ui, sans-serif; letter-spacing: 0.02em;
      }
      #profile-gate-close {
        flex: 0 0 auto; width: 44px; height: 44px; display: grid; place-items: center;
        border: 2px solid rgb(242 179 61 / 55%); border-radius: 50%;
        background: transparent; color: #fff; font-size: 1.1rem; line-height: 1; padding: 0;
      }
      /* Hidden outright while a first hero is being named: there is nowhere to go back to, and a
         dismissable question a child cannot answer any other way is a dead end. */
      #profile-gate-close[data-shown="false"] { display: none; }
      #profile-gate-list { display: flex; flex-direction: column; gap: 0.6rem; }
      .profile-card {
        display: flex; align-items: stretch; gap: 0.5rem;
        border: 2px solid rgb(255 255 255 / 18%); border-radius: 0.7rem;
        background: rgb(20 31 46 / 88%);
      }
      .profile-card[data-active="true"] { border-color: #f2b33d; background: rgb(242 179 61 / 14%); }
      .profile-card-choose {
        flex: 1 1 auto; min-height: 64px; padding: 0.6rem 0.9rem;
        display: flex; flex-direction: row; align-items: center; gap: 0.7rem;
        border: 0; border-radius: 0.6rem; background: transparent; color: #fff;
        text-align: left; font: 800 1.15rem/1.2 system-ui, sans-serif;
      }
      /* THE ANIMAL. The largest thing on the card and the first in reading order, because for the
         child this screen is designed for it is the ONLY thing on it they can decode -- the name is
         letters and the badge is a sentence. Its colour is its own, so two cards differ by more than
         a glyph at a glance. progression/heroAvatars.js says why the animal is stored on the profile
         and therefore never changes when a sibling's save is deleted. */
      .profile-card-face, .profile-card-add-face {
        flex: 0 0 auto; width: 52px; height: 52px; border-radius: 50%;
        display: grid; place-items: center; font-size: 1.7rem; line-height: 1;
        box-shadow: inset 0 0 0 2px rgb(255 255 255 / 22%);
      }
      .profile-card-words { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
      .profile-card-name { display: block; }
      /* The same three pips, in the same order, as the HUD's own Lantern Marks row -- a child
         matches a shape they already know instead of reading a count. The lantern is appended
         rather than being a fourth pip: it is what the three were FOR. */
      .profile-card-pips { display: flex; align-items: center; gap: 0.28rem; margin-top: 0.1rem; }
      .profile-card-pip {
        width: 11px; height: 11px; border-radius: 50%;
        border: 2px solid rgb(242 179 61 / 55%); background: transparent;
      }
      .profile-card-pip[data-filled="true"] { background: #f2b33d; border-color: #f2b33d; }
      .profile-card-lantern { font-size: 0.95rem; line-height: 1; margin-left: 0.15rem; }
      /* The line that lets a child tell their hero from their sibling's. Quieter than the name but
         never small enough to be decoration -- it is doing real work on this screen. */
      .profile-card-badge {
        display: block; color: rgb(255 255 255 / 72%);
        font: 600 0.82rem/1.2 system-ui, sans-serif; letter-spacing: 0.02em;
      }
      .profile-card-remove {
        flex: 0 0 auto; min-width: 44px; min-height: 44px; align-self: center;
        margin-right: 0.5rem; padding: 0 0.7rem;
        border: 2px solid rgb(255 255 255 / 20%); border-radius: 0.5rem;
        background: transparent; color: rgb(255 255 255 / 70%);
        font: 700 0.78rem/1 system-ui, sans-serif;
      }
      /* Armed, and saying so in words rather than in colour alone -- the child who most needs this
         warning is the one least able to read a red tint as a meaning. */
      .profile-card-remove[data-armed="true"] {
        border-color: #e2564d; color: #ff9c95; background: rgb(226 86 77 / 16%);
      }
      /* Looks like a card, is not one -- see profileGate.js's makeButton call for why it does not
         share the .profile-card class. The shared look is repeated here rather than inherited,
         which is the cost of that separation and is worth it. */
      .profile-card-add {
        display: flex; align-items: center; gap: 0.85rem;
        min-height: 64px; width: 100%; padding: 0.6rem 0.9rem;
        border: 2px dashed rgb(242 179 61 / 50%); border-radius: 0.7rem;
        background: transparent; color: #f2b33d;
        font: 800 1.05rem/1.2 system-ui, sans-serif; text-align: left;
      }
      /* The waiting hero's face, dimmed: it is the animal a new hero WOULD get, offered rather than
         owned, and it has to read as different from the four that already exist or the row becomes
         a list of five heroes one of which is a lie. Same size and same shape as theirs, because
         the point is that a child recognises it as the same kind of thing. */
      .profile-card-add-face { opacity: 0.55; filter: saturate(0.8); }
      .profile-card-add-words { min-width: 0; }
      #profile-gate-name-row { display: none; gap: 0.5rem; }
      #profile-gate-name-row[data-shown="true"] { display: flex; }
      #profile-gate-name {
        flex: 1 1 auto; min-height: 52px; padding: 0 0.8rem;
        border: 2px solid rgb(242 179 61 / 55%); border-radius: 0.6rem;
        background: rgb(12 20 31 / 90%); color: #fff;
        font: 800 1.15rem/1.2 system-ui, sans-serif;
      }
      #profile-gate-confirm {
        flex: 0 0 auto; min-width: 96px; min-height: 52px; padding: 0 1rem;
        border: 0; border-radius: 0.6rem; background: #f2b33d; color: #14202f;
        font: 900 1.05rem/1 system-ui, sans-serif; letter-spacing: 0.06em;
      }
      #profile-gate-notice {
        margin: 0; color: rgb(255 255 255 / 70%);
        font: 600 0.85rem/1.35 system-ui, sans-serif;
      }
      #profile-gate-notice[data-shown="false"] { display: none; }
      /* The HUD's own "who is playing" chip, and the only way back into the gate once a hero is
         chosen. Named rather than an icon: the child's own hero name is the most recognisable
         thing that could sit there. */
      #profile-chip {
        /* Third in the top-right control row, left of the Board (52px) and Hero (52px) buttons.
           NOT top-left: #hero-health, #lantern-marks and #quest-objective already stack there, and
           a chip in that column would push the child's own objective further down the screen. */
        position: absolute; top: 0.75rem; right: calc(0.75rem + 52px + 0.5rem + 52px + 0.5rem);
        max-width: min(46vw, 13rem);
        min-height: 44px; padding: 0 0.85rem 0 0.35rem;
        overflow: hidden; white-space: nowrap;
        display: flex; align-items: center; gap: 0.4rem;
        border: 2px solid rgb(242 179 61 / 45%); border-radius: 999px;
        background: rgb(12 20 31 / 78%); color: #f2b33d;
        font: 800 0.9rem/1 system-ui, sans-serif; letter-spacing: 0.02em;
      }
      /* The animal, at chip scale. Its own class and not .profile-card-face -- see GQ-020 in
         docs/MISTAKES.md and the comment at the append site: a chip is not a card, and the readers
         that count cards by their faces must not find this one. The clipping moved onto the NAME so
         a long name ellipsizes and the face never does. */
      .profile-chip-face {
        flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%;
        display: grid; place-items: center; font-size: 1.2rem; line-height: 1;
        box-shadow: inset 0 0 0 2px rgb(255 255 255 / 22%);
      }
      .profile-chip-name { overflow: hidden; text-overflow: ellipsis; }
      #game[data-hero-screen-open="true"] #profile-chip,
      #game[data-village-board-open="true"] #profile-chip { opacity: 0; pointer-events: none; }
      /* Same list the other two overlays hide, plus the chip and the two HUD buttons: this screen is
         a question that has to be answered, so nothing behind it should look tappable. */
      #game[data-profile-gate-open="true"] #keeper-speech,
      #game[data-profile-gate-open="true"] #quest-objective,
      #game[data-profile-gate-open="true"] #banner,
      #game[data-profile-gate-open="true"] #hero-health,
      #game[data-profile-gate-open="true"] #lantern-marks,
      #game[data-profile-gate-open="true"] #loot-hud,
      #game[data-profile-gate-open="true"] #runtime-status,
      #game[data-profile-gate-open="true"] #workshop-interact,
      #game[data-profile-gate-open="true"] #hero-button,
      #game[data-profile-gate-open="true"] #village-board-button,
      #game[data-profile-gate-open="true"] #profile-chip { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <main id="game" aria-label="GalaQuest runtime slice">
      <canvas id="game-canvas" aria-label="GalaQuest game view"></canvas>
      <div id="hero-hurt-flash" aria-hidden="true" data-shown="false"></div>
      <!-- GP1-C5. role=status rather than aria-hidden: "you are out for a moment" is state a screen
           reader user needs, where the hurt flash above is decoration for a fact the bar already
           announce. The bar itself is aria-hidden -- it is the same information as the message, drawn. -->
      <div id="hero-down-veil" role="status" aria-live="polite" data-shown="false">
        <div id="hero-down-bar" aria-hidden="true"></div>
      </div>
      <!-- Floating damage numbers. Decorative only -- the wolf's own spark and hp already carry the
           real state, this is juice on top of it -- so aria-hidden, same as the hurt flash above.
           Populated/emptied by main.js's popDamageNumber(); see screenProjection.js for the maths. -->
      <div id="damage-numbers" aria-hidden="true"></div>
      <!-- P2: A BAR AND A NUMBER, not a fixed row of pips.
           This was four <span class="heart"> elements, one per pip, with a hand-maintained count
           pinned to HERO_MAX_HP_CEILING -- because the markup could not draw a variable number and
           something had to say how many it owed. Every Hero level now grants max HP
           (docs/product/PROGRESSION_CONTRACT_V0.md supersedes the four-heart ceiling), so there is
           no count to hardcode: a Level-20 hero has 125 max HP and would need 125 pips.
           The heart glyph is KEPT as the icon -- see combat/feedback.js's reference research for why
           the same work that once chose pips now chooses a bar, and why the heart itself was never
           the part that stopped working. The numerals are the backup readout the same research
           records for large, continuously-changing health; they are also the only channel that
           survives reduced motion, which is why they are real text and not a title attribute. -->
      <div id="hero-health" role="status" aria-live="polite" aria-label="Hero health">
        <span class="health-icon" aria-hidden="true"></span>
        <span class="health-track" aria-hidden="true"><span class="health-fill"></span></span>
        <span class="health-count"><span id="health-current">30</span><span class="health-slash">/</span><span id="health-max">30</span></span>
      </div>
      <!-- Three spans: matches MARKS_TO_UNLOCK in rewards/marks.js. test/rewards-hud.test.mjs
           asserts that, the same guard feedback.test.mjs already runs for the health readout above. -->
      <div id="lantern-marks" role="status" aria-live="polite" aria-label="Lantern marks">
        <span class="mark" data-filled="false"></span>
        <span class="mark" data-filled="false"></span>
        <span class="mark" data-filled="false"></span>
      </div>
      <!-- GP2: coins and Wildwood Shards. See this element's own CSS comment for why it lives here,
           top-right, rather than stacked into the left-hand status column. -->
      <div id="loot-hud" role="status" aria-live="polite" aria-label="Coins and Wildwood Shards">
        <span class="loot-count" data-kind="coin" data-popped="false">
          <span class="loot-icon" aria-hidden="true"></span><span id="coin-count">0</span>
        </span>
        <span class="loot-count" data-kind="shard" data-popped="false">
          <span class="loot-icon" aria-hidden="true"></span><span id="shard-count">0</span>
        </span>
      </div>
      <!-- What to do next, always on screen while there is something to do. Under the pips, in the
           same dark-pill family, because it answers the question the pips raise ("one of three
           WHAT?"). world/quest.js decides the text; main.js only paints it. -->
      <div id="quest-objective" role="status" aria-live="polite" data-shown="false"></div>
      <!-- GP3-C1: the Workshop's own deliberate interact prompt. Hidden by default, shown only while
           the built Workshop's own ceremony has finished AND the hero is within WORKSHOP_INTERACT's
           radius (main.js decides both every frame) -- tapping it opens the existing Hero/Gear screen,
           repeatably, same as #hero-button. -->
      <button id="workshop-interact" type="button" data-shown="false">🛠 GEAR</button>
      <!-- W1: the keeper's line. Hidden by default (data-shown="false"), driven every frame from
           world/keeperSpeech.js's keeperSpeechState -- proximity, unlock state and show/hide are
           all decided there, not here. main.js stops the speaker button's own pointerdown from
           bubbling to #game, so a tap on it is never mistaken for the start of a camera drag
           (input/cameraGesture.js listens on #game itself and has no other veto for this button). -->
      <div id="keeper-speech" role="status" aria-live="polite" data-shown="false">
        <div id="keeper-speech-body">
          <!-- The speaker's own row. It used to be the first six words of every line, which on a
               768px viewport pushed a the younger bracket reader's actual sentence onto a fourth wrapped line
               and made the read-aloud button say "Keeper Aldric" before every single utterance.
               main.js fills it from keeperSpeech.js's KEEPER_NAME. -->
          <span id="keeper-speech-name"></span>
          <span id="keeper-speech-text"></span>
        </div>
        <button id="keeper-speech-speak" type="button" aria-label="Hear this line aloud">🔊</button>
      </div>
      <div id="runtime-status" role="status" data-debug="false" data-fault="false">loading hero…</div>
      <div id="perf-hud" aria-live="polite" data-debug="false">loading hero…</div>
      <div id="touch-stick" data-thumb-surface aria-label="Movement stick"><div id="touch-stick-knob"></div></div>
      <button id="attack-button" type="button" data-thumb-surface aria-label="Attack">ATTACK</button>
      <p id="desktop-keys">move <b>WASD</b> · swing <b>Space</b> · look <b>drag</b> · zoom <b>scroll</b></p>
      <div id="objective-pointer" data-shown="false" aria-hidden="true"><span id="objective-pointer-arrow">➤</span></div>
      <button id="guidance-rescue" type="button" data-shown="false">👀 Show me where</button>
      <canvas id="minimap" width="220" height="220" aria-hidden="true"></canvas>
      <div id="banner" role="status" aria-live="polite" data-shown="false"></div>
      <!-- GP1: the Hero screen. aria-pressed mirrors data-shown on #hero-screen -- one boolean, two
           readers. Not gated behind data-thumb-surface: it is a normal button outside the movement/
           attack thumb zones, not a second stick or attack surface. -->
      <button id="hero-button" type="button" aria-label="Hero" aria-pressed="false">🗡</button>
      <div id="hero-screen" role="dialog" aria-modal="true" aria-label="Hero" data-shown="false">
        <div id="hero-screen-header">
          <span id="hero-screen-title">HERO</span>
          <button id="hero-screen-close" type="button" aria-label="Close Hero screen">✕</button>
        </div>
        <!-- Five slots, always. Populated/locked by progression/heroScreen.js's renderSlots -- see
             its own header comment for why only the first (Weapon) is interactive in GP1. -->
        <div id="hero-slots">
          <div class="hero-slot" data-slot="weapon"><span class="hero-slot-name hero-slot-label"></span></div>
          <div class="hero-slot" data-slot="shield" data-locked="true"><span class="hero-slot-label">Shield</span></div>
          <div class="hero-slot" data-slot="helmet" data-locked="true"><span class="hero-slot-label">Helmet</span></div>
          <div class="hero-slot" data-slot="shoulders" data-locked="true"><span class="hero-slot-label">Shoulders</span></div>
          <div class="hero-slot" data-slot="chest" data-locked="true"><span class="hero-slot-label">Chest</span></div>
        </div>
        <!-- Owned-item strip. Rebuilt per render() by progression/heroScreen.js -- both v0 items
             ship owned (progression/items.js), so this always shows the Starter Sword and the
             Wildwood Blade side by side, ahead of GP9's real reward ceremony. -->
        <div id="hero-item-list" role="listbox" aria-label="Owned weapons"></div>
        <div id="hero-item-card">
          <div id="hero-item-name"></div>
          <div id="hero-item-damage"></div>
          <div id="hero-item-compare"></div>
          <button id="hero-equip-button" type="button" data-shown="false">EQUIP</button>
        </div>
      </div>
      <!-- GP3: the Village Board -- a strategic popup map, not an economy spreadsheet (see
           village/boardScreen.js's own header). Same aria-pressed/data-shown pairing as the Hero
           button/screen above. -->
      <button id="village-board-button" type="button" aria-label="Village Board" aria-pressed="false">🗺</button>
      <!-- Who is playing, and the way back to the gate. The hero's own NAME rather than an icon:
           it is the most recognisable thing that could sit here for the child it belongs to. -->
      <button id="profile-chip" type="button" aria-label="Change who is playing"></button>
      <div id="village-board-screen" role="dialog" aria-modal="true" aria-label="Village Board" data-shown="false">
        <div id="village-board-header">
          <span id="village-board-title">VILLAGE</span>
          <button id="village-board-close" type="button" aria-label="Close Village Board">✕</button>
        </div>
        <!-- Five nodes, always -- the brief's own fixed list (section 4). Populated by
             village/boardScreen.js's renderNodes; only Workshop opens a real detail state below. -->
        <div id="village-board-nodes" role="listbox" aria-label="Village nodes">
          <button class="village-board-node" type="button" data-node="lantern-tree" data-kind="current">
            <span class="village-board-node-label">Lantern Tree</span>
            <span class="village-board-node-status"></span>
          </button>
          <button class="village-board-node" type="button" data-node="workshop" data-kind="actionable">
            <span class="village-board-node-label">Workshop</span>
            <span class="village-board-node-status"></span>
          </button>
          <button class="village-board-node" type="button" data-node="lantern-library" data-kind="future">
            <span class="village-board-node-label">Lantern Library</span>
            <span class="village-board-node-status"></span>
          </button>
          <button class="village-board-node" type="button" data-node="ranger-lodge" data-kind="future">
            <span class="village-board-node-label">Ranger Lodge</span>
            <span class="village-board-node-status"></span>
          </button>
          <button class="village-board-node" type="button" data-node="garden-farm" data-kind="future">
            <span class="village-board-node-label">Garden &amp; Farm</span>
            <span class="village-board-node-status"></span>
          </button>
        </div>
        <!-- Workshop's own detail state (section 4: "what is it / what changes / what does it
             cost"). Populated/shown by village/boardScreen.js's renderDetail; hidden entirely
             (data-shown="false") whenever nothing actionable is selected. -->
        <div id="village-board-detail" data-shown="false">
          <div id="village-board-detail-title"></div>
          <div id="village-board-detail-what"></div>
          <div id="village-board-detail-cost" data-shown="false">
            <span class="village-board-cost-icon village-board-cost-coin" data-kind="coin">
              <span class="village-board-cost-glyph" aria-hidden="true"></span>
              <span class="village-board-cost-value"></span>
            </span>
            <span class="village-board-cost-icon village-board-cost-shard" data-kind="shard">
              <span class="village-board-cost-glyph" aria-hidden="true"></span>
              <span class="village-board-cost-value"></span>
            </span>
          </div>
          <div id="village-board-detail-future" data-shown="false">Not yet.</div>
          <button id="village-board-upgrade-button" type="button" data-shown="false">UPGRADE</button>
        </div>
      </div>
      <!-- The family profile gate. A shared tablet, per-child saves: this is where a child says
           which hero is theirs. Cards are BUILT by progression/profileGate.js rather than declared
           here, because the number of heroes genuinely varies from one to four and markup for four
           with three hidden is a shape that lies about what is on screen. -->
      <div id="profile-gate" role="dialog" aria-modal="true" aria-label="Who is playing" data-shown="false">
        <div id="profile-gate-panel">
          <!-- Only on the naming screen, where there are no cards and therefore nothing else a child
               who cannot read can look at. Above the question, because it is the part they can
               actually use and the question is for the grown-up beside them. -->
          <div id="profile-gate-face" data-shown="false" role="img" aria-label=""></div>
          <div id="profile-gate-header">
            <h2 id="profile-gate-title">Who is playing?</h2>
            <button id="profile-gate-close" type="button" aria-label="Close" data-shown="true">✕</button>
          </div>
          <div id="profile-gate-list" role="list" aria-label="Heroes on this tablet"></div>
          <div id="profile-gate-name-row" data-shown="false">
            <input id="profile-gate-name" type="text" maxlength="16" autocomplete="off"
                   spellcheck="false" aria-label="Hero name" placeholder="Hero" />
            <button id="profile-gate-confirm" type="button" data-intent="create">START</button>
          </div>
          <p id="profile-gate-notice" data-shown="false"></p>
        </div>
      </div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
