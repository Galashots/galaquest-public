name: pr26-import-meshy-candidates

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  import:
    if: >-
      github.event.pull_request.number == 26 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/ranger-lodge-expansion' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout literal PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Validate and import explicit Meshy candidates
        shell: bash
        run: |
          set -euo pipefail
          manifest='tools/asset-import/meshy-pr26.json'
          test -f "$manifest"
          test "$(jq -r '.pr' "$manifest")" = '26'

          jq -c '.assets[]' "$manifest" | while IFS= read -r item; do
            id="$(jq -r '.id' <<<"$item")"
            task="$(jq -r '.task' <<<"$item")"
            path="$(jq -r '.path' <<<"$item")"
            url="$(jq -r '.url' <<<"$item")"

            case "$url" in
              https://assets.meshy.ai/*) ;;
              *) echo "rejecting non-Meshy URL for $id" >&2; exit 1 ;;
            esac
            case "$path" in
              public/assets/*/candidates/*.glb) ;;
              *) echo "rejecting non-candidate destination for $id: $path" >&2; exit 1 ;;
            esac

            mkdir -p "$(dirname "$path")"
            curl --fail --location --retry 3 --retry-all-errors --silent --show-error "$url" -o "$path"

            magic="$(xxd -p -l 4 "$path")"
            test "$magic" = '676c5446' || { echo "$id is not a GLB (magic=$magic)" >&2; exit 1; }
            size="$(stat -c '%s' "$path")"
            test "$size" -gt 1000 || { echo "$id is implausibly small: $size bytes" >&2; exit 1; }
            test "$size" -lt 26214400 || { echo "$id exceeds 25 MiB candidate ceiling: $size bytes" >&2; exit 1; }
            digest="$(sha256sum "$path" | awk '{print $1}')"
            printf 'IMPORTED id=%s task=%s path=%s bytes=%s sha256=%s\n' "$id" "$task" "$path" "$size" "$digest"
          done

      - name: Commit candidates and self-delete importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GalaQuest Asset Importer'
          git config user.email 'actions@users.noreply.github.com'
          git add public/assets
          git rm tools/asset-import/meshy-pr26.json .github/workflows/pr26-import-meshy-candidates.yml
          git commit -m 'assets: import Meshy PR26 candidates'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
