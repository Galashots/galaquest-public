name: unity

on:
  pull_request:
    paths:
      - 'unity/**'
      - 'tools/unity/**'
      - '.github/workflows/unity.yml'
  push:
    branches:
      - main
    paths:
      - 'unity/**'
      - 'tools/unity/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:

concurrency:
  group: unity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  editmode:
    # This repository is public. Never execute an untrusted fork PR on Leo's desktop.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, galaquest-unity, unity-6000.3.23f1]
    timeout-minutes: 45
    env:
      UNITY_PROJECT_PATH: ${{ github.workspace }}\unity\GalaQuest

    steps:
      - name: Refuse an occupied Unity desktop
        shell: powershell
        run: |
          $active = Get-Process Unity -ErrorAction SilentlyContinue
          if ($active) {
            $active | Select-Object Id, ProcessName, Path | Format-Table -AutoSize
            throw 'Unity is already running on the self-hosted desktop. Refusing to collide with an interactive Editor session.'
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Preserve the ignored Unity Library cache on this dedicated CI workspace.
          clean: false

      - name: Normalize workspace while preserving Unity Library
        shell: powershell
        run: |
          git reset --hard HEAD
          git clean -ffdx -e unity/GalaQuest/Library/

      - name: Verify pinned Unity runner
        shell: powershell
        run: |
          if (-not $env:UNITY_EXE) {
            throw 'UNITY_EXE is not configured on this self-hosted runner.'
          }
          if (-not (Test-Path $env:UNITY_EXE)) {
            throw "Configured UNITY_EXE does not exist: $env:UNITY_EXE"
          }
          $projectVersion = Get-Content "$env:UNITY_PROJECT_PATH\ProjectSettings\ProjectVersion.txt" -Raw
          if ($projectVersion -notmatch 'm_EditorVersion:\s*6000\.3\.23f1') {
            throw "ProjectVersion.txt is not pinned to 6000.3.23f1: $projectVersion"
          }
          Write-Host "Unity executable: $env:UNITY_EXE"
          Write-Host "Project: $env:UNITY_PROJECT_PATH"

      - name: Run Unity EditMode tests
        shell: powershell
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'galaquest-editmode-results.xml'
          $log = Join-Path $env:RUNNER_TEMP 'galaquest-unity-editmode.log'
          Remove-Item $results, $log -Force -ErrorAction SilentlyContinue

          & $env:UNITY_EXE `
            -batchmode `
            -nographics `
            -quit `
            -projectPath $env:UNITY_PROJECT_PATH `
            -buildTarget WebGL `
            -runTests `
            -testPlatform EditMode `
            -testResults $results `
            -logFile $log

          $exit = $LASTEXITCODE
          if (Test-Path $log) {
            Get-Content $log -Tail 160
          }
          if (-not (Test-Path $results)) {
            throw "Unity produced no EditMode results file (exit code $exit)."
          }
          if ($exit -ne 0) {
            throw "Unity EditMode tests failed with exit code $exit."
          }

      - name: Verify Unity left tracked source clean
        if: always()
        shell: powershell
        run: |
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) {
            Write-Host $dirty
            throw 'Unity CI modified tracked repository files.'
          }

      - name: Upload Unity test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}\galaquest-editmode-results.xml
            ${{ runner.temp }}\galaquest-unity-editmode.log
          if-no-files-found: warn
          retention-days: 14
