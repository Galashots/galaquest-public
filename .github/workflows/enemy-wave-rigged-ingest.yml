      - name: Structural GLB audit and provenance manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const entries = [
            ['Spriggan Scrapper','spriggan-scrapper-v1.glb','01a022c2-f4a4-7134-b2a7-190684b04449','01a022c5-8fb4-71c3-ac86-db31b0fa497d'],
            ['Thornback Orc','thornback-orc-v1.glb','01a022c3-03de-7dfe-9616-b58d8a9b5c4f','01a022c5-c06a-770e-9883-a21e6ae12e35'],
            ['Stagroot Warden','stagroot-warden-v1.glb','01a022c3-1355-7cbb-88df-111a2248a7f3','01a022c5-e4cd-7710-9e27-61976c468f5e'],
            ['Coalclaw Kobold','coalclaw-kobold-v1.glb','01a022c3-2173-7cbd-9f84-b233c003bbe6','01a022c7-1190-7ebf-a3a6-3eabb4a690ba'],
            ['Cinderfang Raider','cinderfang-raider-v1.glb','01a022c3-2f7c-7e10-8508-72c176cc9cdd','01a022c7-5c78-7234-bec0-e31f5c328227'],
            ['Magmahorn Juggernaut','magmahorn-juggernaut-v1.glb','01a022c3-3f4e-76a3-8b03-f42da4c6be6d','01a022c7-8283-7ee0-9f69-2d40003958de'],
            ['Snowfang Marauder','snowfang-marauder-v1.glb','01a022c3-4d65-76a8-913b-1d0ef9360a24','01a022c7-aade-7ee3-8042-c4a1bffae41c'],
            ['Iceback Ogre','iceback-ogre-v1.glb','01a022c3-5cd0-7144-b5c7-ca75d5bdd5f9','01a022c7-d8c8-7255-bec7-e335bc585994'],
            ['Frostbound Warden','frostbound-warden-v1.glb','01a022c3-77c1-7e19-8251-cb1649bc8e53','01a022c8-0132-7db6-9f98-4e34ffabf7d6'],
            ['Boneguard Raider','boneguard-raider-v1.glb','01a022c3-950d-7e1f-a29a-ffe70afc8677','01a022c8-3270-7270-808a-c6fa6b7bd71e'],
            ['Tombmaul Knight','tombmaul-knight-v1.glb','01a022c3-a5f2-7e24-b58e-dd509791e724','01a022c8-5863-7dbc-8c98-868b5599cc34'],
            ['Graveflame Reaper','graveflame-reaper-v1.glb','01a022c3-b8ca-7ccb-bb21-7c04a9c745f6','01a022c8-7d2a-7277-9ab2-0965094e9cd0'],
            ['Stormbreaker Colossus','stormbreaker-colossus-v1.glb','01a022c3-cc9a-76b8-a968-3a86e078e61c','01a022c8-a568-7dbf-9254-43d45434a91b'],
          ];

          function inspectGlb(file) {
            const buf = fs.readFileSync(file);
            if (buf.length < 20) throw new Error('too small');
            if (buf.toString('ascii', 0, 4) !== 'glTF') throw new Error('bad GLB magic');
            const version = buf.readUInt32LE(4);
            const declared = buf.readUInt32LE(8);
            if (version !== 2) throw new Error(`unsupported GLB version ${version}`);
            if (declared !== buf.length) throw new Error(`declared length ${declared} != actual ${buf.length}`);
            let off = 12;
            let json = null;
            while (off + 8 <= buf.length) {
              const len = buf.readUInt32LE(off);
              const type = buf.readUInt32LE(off + 4);
              const end = off + 8 + len;
              if (end > buf.length) throw new Error('chunk overruns file');
              if (type === 0x4E4F534A) {
                json = JSON.parse(buf.subarray(off + 8, end).toString('utf8').replace(/\u0000/g, '').trim());
              }
              off = end;
            }
            if (!json) throw new Error('missing JSON chunk');
            const skins = json.skins || [];
            const meshes = json.meshes || [];
            const nodes = json.nodes || [];
            const materials = json.materials || [];
            const textures = json.textures || [];
            const images = json.images || [];
            const joints = skins.reduce((n, s) => n + ((s.joints || []).length), 0);
            if (buf.length < 1_000_000) throw new Error(`suspiciously small (${buf.length})`);
            if (meshes.length < 1) throw new Error('no mesh');
            if (skins.length < 1 || joints < 10) throw new Error(`missing/weak skin (${skins.length} skins, ${joints} joints)`);
            return { bytes: buf.length, meshes: meshes.length, skins: skins.length, joints, nodes: nodes.length, materials: materials.length, textures: textures.length, images: images.length, embeddedAnimations: (json.animations || []).length };
          }

          const audit = [];
          const manifest = [];
          for (const [name, filename, sourceTaskId, rigTaskId] of entries) {
            const repoPath = `public/assets/enemies/candidates/${filename}`;
            const metrics = inspectGlb(repoPath);
            audit.push({ name, filename, result: 'PASS_STRUCTURAL', ...metrics });
            manifest.push({
              name,
              candidate_path: repoPath,
              image_to_3d_task_id: sourceTaskId,
              rig_task_id: rigTaskId,
              base_rigged_glb_committed: true,
              basic_walk_run_available_from_rig_task: true,
              walk_run_committed: false,
              promotion_status: 'candidate-only',
              visual_acceptance: 'UNKNOWN'
            });
          }
          fs.writeFileSync('docs/asset-production/ENEMY_WAVE_1_STRUCTURAL_AUDIT.json', JSON.stringify({ generated_at: new Date().toISOString(), criteria: 'GLB v2 header/length, >=1 mesh, >=1 skin, >=10 joints, >1MB', entries: audit }, null, 2) + '\n');
          fs.writeFileSync('docs/asset-production/ENEMY_WAVE_1_PROVENANCE.json', JSON.stringify({ wave: 'enemy-wave-1', owner_credit_ceiling: 500, observed_total_spend: 482, current_provider_balance_at_audit: 697, mapping_note: 'Rig task IDs recorded in the same launch order as the Wave 1 source model ledger.', entries: manifest }, null, 2) + '\n');
          console.table(audit);
          NODE

      - name: Commit candidate binaries and remove one-shot ingest workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/enemies/candidates/*.glb docs/asset-production/ENEMY_WAVE_1_STRUCTURAL_AUDIT.json docs/asset-production/ENEMY_WAVE_1_PROVENANCE.json
          git rm .github/workflows/enemy-wave-rigged-ingest.yml
          git commit -m 'assets(enemies): stage rigged wave 1 candidates'
          git push origin HEAD:feat/enemy-asset-wave-1
