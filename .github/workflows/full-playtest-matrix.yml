name: full-playtest-matrix

on:
  # `integration/**` is a reviewed convergence lane. It is on the PUSH trigger deliberately, and not
  # on pull_request: a pull_request run reports against a synthetic merge SHA, and an integration
  # result has to bind to the exact branch head an independent reviewer audits.
  push:
    branches: [main, 'integration/**']
    # A prose-only diff cannot change what a browser-driven harness observes: no harness reads a
    # markdown file as input -- every docs/ and *.md mention under tools/runtime-test/ is a comment
    # citing a rule, not a load. Running 27 hosted jobs (66-79 runner-minutes) to re-observe an
    # unchanged game is spend with no signal attached, so a diff that is entirely markdown skips.
    #
    # DELIBERATELY NOT IGNORED: .github/workflows/** -- a change to the matrix must be validated BY
    # the matrix. Nor tools/**, which is where the harnesses themselves live.
    #
    # IF THIS EVER BECOMES A REQUIRED CHECK, REVISIT. paths-ignore produces no run at all rather
    # than a passing one, and a required check that never runs blocks the merge button forever. It
    # is safe today precisely because the matrix is not required (it has never been green on main).
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to review'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: full-playtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        name:
          - drive-village
          - drive-relight
          - drive-lifecycle
          - drive-marks
          - drive-touch
          - drive-two-clients
          - play-fight
          - fit-carry
          - fit-sword
          - fit-shield
          - fit-lantern
          - fit-wildwood-blade
          - review-keeper-idle
          - review-hero-attack
          - review-keeper-material
          - review-keeper-turn
          - review-hero-idle11
          - review-shipping-assets
          - review-rowan-camp-composite
          - review-studio
          - review-owner-annotations
          - drive-hero-screen
          - drive-cart-loot
          - drive-village-board
          - drive-old-beacon
          - drive-beacon-siege
          - drive-ranger
          - drive-profile-gate
          - drive-recovery
          - drive-guidance-rescue
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Launch isolated Chrome
        # TWO ATTEMPTS, AND A LONGER WAIT, because this step has been the single largest source of
        # red in this matrix and none of it was ever about the diff.
        #
        # It launched Chrome once and waited 25 s. Measured across three consecutive runs of this
        # workflow it failed in a DIFFERENT job each time -- review-studio, then fit-carry, then
        # fit-wildwood-blade -- each time at exactly 25.0 s, with the harness step skipped and no
        # artifacts uploaded, so the check reported a red harness that had never executed a line.
        # Twenty-six jobs start at once on hosted runners and cold-start a browser; the one that
        # loses that race is not the one with a bug in it.
        #
        # A red that means "the browser did not start" and a red that means "the game is broken" are
        # the same colour on the PR page, which is what makes this expensive: every occurrence costs
        # somebody a log read to find out it was nothing. So: wait 60 s rather than 25, and if that
        # genuinely fails, kill the corpse and try ONCE more from clean.
        #
        # Deliberately not an unbounded retry loop. Two attempts distinguishes contention from a
        # broken image; a browser that cannot start twice in two minutes is a real failure and this
        # step must still go red for it, or the harnesses fail open (see the Run step's own comment).
        run: |
          start_chrome() {
            rm -rf "$RUNNER_TEMP/gq-chrome"
            google-chrome \
              --remote-debugging-port=9224 \
              --user-data-dir="$RUNNER_TEMP/gq-chrome" \
              --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
              --hide-scrollbars --no-first-run --no-default-browser-check about:blank \
              >"$RUNNER_TEMP/chrome.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/gq-chrome.pid"
            for i in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:9224/json/version >/dev/null; then return 0; fi
              sleep 0.5
            done
            return 1
          }
          for attempt in 1 2; do
            if start_chrome; then
              echo "chrome up on attempt ${attempt}"
              exit 0
            fi
            echo "chrome did not answer on 9224 within 60s (attempt ${attempt})"
            cat "$RUNNER_TEMP/chrome.log" || true
            kill "$(cat "$RUNNER_TEMP/gq-chrome.pid")" 2>/dev/null || true
            sleep 2
          done
          exit 1
      - name: Run ${{ matrix.name }}
        # A measuring instrument expresses "no automated verdict" by exiting 0 and publishing its
        # evidence. Any non-zero exit is therefore an execution/infrastructure failure and must stay
        # red; converting it to success made missing Chrome, syntax errors and crashes fail open.
        run: node tools/runtime-test/${{ matrix.name }}.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-${{ matrix.name }}-${{ github.run_id }}
          path: .local/runtime-test
          if-no-files-found: ignore
          retention-days: 30
      - name: Clean owned review processes
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/gq-chrome.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/gq-chrome.pid")" 2>/dev/null || true
          fi
          pkill -f 'node server.mjs' 2>/dev/null || true
          sleep 1
          LEFT=$(pgrep -c -f 'remote-debugging-port=9224' || true)
          SERVERS=$(pgrep -c -f 'node server.mjs' || true)
          echo "chrome on 9224 still running: ${LEFT:-0}"
          echo "game servers still running:   ${SERVERS:-0}"
