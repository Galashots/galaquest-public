name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test 'test/**/*.test.mjs'
      # Boots the game in headless Chrome at iPad sizes; fails on any browser error.
      - run: CHROME="$(command -v google-chrome)" node tools/screenshot.mjs --out tmp/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tmp/screenshots/
