# Render Blueprint: a public playtest instance of the game. No build step; server.mjs serves game/.
services:
  - type: web
    name: galaquest-playtest
    runtime: node
    plan: free
    buildCommand: 'echo "no build step"'
    startCommand: 'node server.mjs "$PORT"'
    healthCheckPath: /
    previews:
      generation: manual
    envVars:
      - key: NODE_VERSION
        value: "24"
