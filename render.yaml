# Render Blueprint: a public playtest instance of GalaQuest.
#
# Purpose: give browser-driving agents (e.g. ChatGPT agent mode) and remote human testers a real,
# public URL running the actual game -- client, authoritative server, and WebSocket co-op on one
# origin -- without any local network access. See docs/public-playtest.md.
#
# This deploys server.mjs exactly as a contributor runs it. There are no npm dependencies and no
# compile step, by repository design; the build command is intentionally a no-op and provenance is
# stamped immediately before the runtime server starts.
services:
  - type: web
    name: galaquest-playtest
    runtime: node
    plan: free
    # Render documents buildCommand as the build phase for native web services, even for a repo that
    # has no package.json or compile step, so keep the command honest and harmless rather than inventing
    # work for it to do. The first live deployment attempted to stamp provenance here yet the running
    # service served 404 for /source-sha.json. That observation proves the build-time stamp was not a
    # reliable runtime evidence seam; it does NOT prove the build command itself was skipped.
    buildCommand: 'echo "no build step (see README): plain ES modules, vendored deps"'
    # Two things, in order: stamp the commit this RUNNING instance is serving, then become the server.
    # Doing this at process start makes the required property direct: every boot writes the evidence
    # file into the same filesystem server.mjs immediately serves, without depending on an unproven
    # theory about why the first build-time stamp was absent from the live instance.
    #
    # The stamp is the one thing a remote playtester cannot otherwise learn from the running site.
    # AGENTS.md requires every observation to name the exact SHA it proves, and an agent handed only
    # a URL has no other independent seam -- the Render dashboard is not reachable from a
    # browser-driving agent. RENDER_GIT_COMMIT is a Render default environment variable available to
    # the service; it falls back to "unknown" rather than aborting boot, so a missing variable degrades
    # the evidence, not the service.
    #
    # exec matters: it replaces the shell with node so signals still reach the server and Render can
    # stop/restart the instance cleanly. server.mjs takes its port as argv[2]; Render supplies $PORT
    # (never 5199, which server.mjs reserves for the decision lab and refuses).
    startCommand: |
      printf '{"sourceSha":"%s"}\n' "${RENDER_GIT_COMMIT:-unknown}" > public/source-sha.json
      exec node server.mjs "$PORT"
    healthCheckPath: /
    # Per-PR preview instances are opt-in, not automatic: they consume the same free instance hours
    # as the main service, and most PRs here (CI and docs work) have nothing to play. "manual" is
    # one of the two values Render accepts at service level, the other being "automatic".
    previews:
      generation: manual
    envVars:
      # node:sqlite (rewardStore) needs Node 22+; match CI's Node 24.
      - key: NODE_VERSION
        value: "24"
      # The hosted instance must never write the children's real save (data/rewards.db -- gitignored
      # by data/*.db*, so it is never in a deploy, but the default path would still create one).
      # Point the reward store at a disposable path on ephemeral disk instead; it resets on every
      # deploy/restart, which is exactly right for a playtest surface.
      - key: GALAQUEST_REWARD_STORE_PATH
        value: /tmp/galaquest-playtest-rewards.db
